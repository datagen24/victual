# The differential test suite, on every pull request with non-Markdown changes.
#
# What this gates is the one thing this fork can most easily break without noticing:
# that the application behaves identically on SQLite and PostgreSQL. A view that quietly
# returns different rows on one engine is invisible in review and obvious here.
#
# The suite is deliberately not run on the repository's Dockerfile. That image exists so a
# contributor can run the suite locally without installing PHP and PostgreSQL by hand;
# CI already has both, and building an image on every pull request would add minutes to
# the feedback loop for no extra coverage. Both paths run the same runner script, so
# there is one definition of what "the suite" means.
#
# The development image is built in its own job; production images use nix.yml.

name: tests

# The token needs to read the repository and nothing else: no job here writes to it, and
# the coverage upload goes through the artifact API, which contents: read covers. Named
# explicitly so the default grant never applies (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # check_deploy_manifest.py is the one script under .devtools/ci that parses a
      # real document format rather than treating text as regex input, so it is the
      # one with a dependency. PyYAML is pure Python and has no build step.
      - name: Install manifest-check dependencies
        run: pip install --quiet pyyaml==6.0.1

      - name: Check CI validation scripts
        run: python3 -m unittest discover -s .devtools/ci

      - name: Check changed ADR headers
        run: python3 .devtools/ci/check_adr_headers.py

      # ADR-0010 property 3 (unprivileged) and property 4 (declared, with probes and
      # limits) as they apply to deploy/**'s manifests rather than to the images
      # nix/checks.nix already covers. This runs unconditionally, on the whole
      # deploy/** tree, rather than being folded into the nix workflow's path filter:
      # a manifest is not a Nix build input, so gating it behind a full image rebuild
      # would answer a YAML-only change with a ten-minute job. See
      # docs/adr/0010-workload-standard.md open question 2.
      - name: Check deploy manifests
        run: python3 .devtools/ci/check_deploy_manifest.py

      # There is no configured linter in this repository, so this is a syntax sweep
      # rather than a style check. It is cheap and it catches the parse error that
      # would otherwise fail every job below with a much less obvious message.
      # php -l writes both its success line and its parse errors to stdout, so the
      # output is captured rather than discarded: discarding it hides the filename and
      # leaves a failing job showing nothing but an exit code.
      - name: Check PHP syntax
        run: |
          if ! find . -name '*.php' \
              -not -path './packages/*' \
              -not -path './public/packages/*' \
              -print0 \
            | xargs -0 -n1 -P4 php -l > lint.log 2>&1; then
            grep -v '^No syntax errors detected' lint.log
            exit 1
          fi

      # SQL assembled inside PHP is invisible to the view/trigger differential suite.
      # Keep SQLite-only functions out of request-time queries so PostgreSQL does not
      # discover them as a user-facing 400 or 500.
      - name: Check runtime SQL portability
        run: php .devtools/pgsql/check-runtime-sql.php

      # Every CI job the documentation names has to exist. The `frontend-security` job
      # below was described in four documents for a day before it was written, and while
      # it did not exist nobody looked for the gate it claimed to be. See
      # docs/plans/21-frontend-sink-discipline.md and the script's own header.
      - name: Every cited CI job exists
        run: php .devtools/check-cited-jobs.php

      # The documentation site. --strict turns a broken link or a page missing from the
      # nav into a failure here rather than into a defect on the published site. No
      # container runtime and no PHP are needed: the staging script omits the API
      # reference when it finds neither, which is the same path a contributor without
      # Docker takes. See docs/plans/26-documentation-site.md.
      - name: Build the documentation site
        run: |
          pip install --quiet --requirement .devtools/docs/requirements.txt
          python3 .devtools/docs/stage.py --no-api
          mkdocs build --strict --site-dir /tmp/docs-site

  suite:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: victual
          POSTGRES_PASSWORD: victual
          POSTGRES_DB: victual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U victual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 8.4 is the fork's real language floor. composer.json still declares 8.5 until
      # 15-C7 lowers it, which is why the install below ignores the platform
      # requirement; once that lands, the flag can go.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype
          # pcov rather than the default none, so the run below can report what the
          # suite reached. It only collects when a process asks it to.
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts --ignore-platform-req=php

      # PathParameterMiddleware reads which path parameters are integer ids out of
      # victual.openapi.json, so an undocumented parameter is an unvalidated one - and an
      # unvalidated id reached PostgreSQL as a type error, answering 500 with the failing
      # statement in the body. See issue #48.
      #
      # In this job rather than in `lint` because it registers the real route table
      # instead of parsing routes.php with a regular expression - what the application
      # actually serves is the route table, and a check that reads the file would
      # disagree with it the first time a route is written in a way the pattern did not
      # anticipate. Registering means booting Slim, and `lint` deliberately installs no
      # dependencies. It runs before the suite because it is the cheaper of the two and
      # its failure is the easier one to read.
      - name: Every API path parameter is typed
        run: php .devtools/check-path-id-validation.php

      # The workflow calls the same entry point a contributor runs locally, rather than
      # restating the commands. A suite that drifts from the one people run by hand is
      # a suite nobody trusts.
      #
      # Coverage is measured but nothing is gated on it. What the suite reaches is
      # worth seeing in the log of every run — it is how a phase that silently stopped
      # exercising something gets noticed — but a threshold nobody has chosen would
      # only ever be tuned until it stopped failing.
      - name: Run the differential test suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: victual
          PGPASSWORD: victual
          SUITE_COVERAGE: 1
          SUITE_COVERAGE_CLOVER: clover.xml
        run: .devtools/pgsql/run-tests.sh

      # Node is on the runner, and the differential half of this needs it: the ECMAScript
      # oracle is correct by construction and a PHP reimplementation of it would only be a
      # second thing to be wrong.
      - name: RFC 8785 canonicalization
        run: php .devtools/labels/canonical-json-tests.php

      - name: Label identity and import concurrency
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
        run: php .devtools/labels/identity-tests.php

      - name: Label templates, renders and artifacts
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
        run: php .devtools/labels/artifact-tests.php

      - name: Label print jobs and fences
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
        run: php .devtools/labels/print-job-tests.php

      # The check neither repository can make alone: the real renderer's output, fed to the
      # verifier that will accept or refuse it in production. Both would pass on their own if
      # each were wrong about the same axis in the same direction, which is the defect the
      # 2026-09-07 renderer comparison actually found in two candidates.
      #
      # The revision is the one flake.lock pins, so this checks the binary the images are
      # built from rather than whatever is on the renderer's main branch today.
      - name: Check out the pinned renderer
        uses: actions/checkout@v4
        with:
          repository: datagen24/victual-label-renderer
          ref: f05c432f7857f976e0223296f968d641fa401254
          path: .agreement

      - name: Build the pinned renderer
        working-directory: .agreement
        run: cargo build --release

      - name: The renderer and the verifier agree about geometry
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_RENDERER_BIN: .agreement/target/release/victual-label-renderer
          VICTUAL_RENDERER_FONT: .agreement/tests/fixtures/NotoSans-Regular.ttf
        run: php .devtools/labels/renderer-agreement-tests.php

      - name: Label worker API and credentials
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
        run: php .devtools/labels/worker-api-tests.php

      - name: Label registry and configuration
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
        run: php .devtools/labels/registry-tests.php

      # Uploaded even when the suite fails: which code a failing run did and did not
      # reach is part of reading the failure.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: clover.xml
          if-no-files-found: warn

  # The gate this repository has claimed to run since 2026-09-03 and did not: sweep S29's
  # payload probe, which asserts that no page executes a payload it is asked to display.
  # Three documents described this job before it existed, and in the gap two sinks of
  # exactly the class S29 closed reached master and stayed open until an external scanner
  # reported them. See docs/plans/21-frontend-sink-discipline.md.
  frontend-security:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest

    # The probe drives a demo instance, and since ADR-0008's retirement a demo instance is a
    # PostgreSQL one: DB_DRIVER no longer accepts "sqlite", and DemoDataGeneratorService is
    # portable so that this mode still has an engine to run on. The job therefore needs a
    # database where it previously needed a file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: victual
          POSTGRES_PASSWORD: victual
          POSTGRES_DB: victual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U victual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 8.5, not the 8.4 the suite job uses. This one boots the application through
      # public/index.php, where PrerequisiteChecker enforces REQUIRED_PHP_VERSION, and
      # composer.json pins 8.5.* - so this is the version the app says it needs, and no
      # platform requirement has to be ignored to install against it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-frontend-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      # The views load their CSS and JS from /packages/..., and .yarnrc points yarn at
      # public/packages. Without them the pages boot unstyled and, more to the point, with
      # no jQuery - so every probe would report "the sink was never reached" and the job
      # would fail for a reason that has nothing to do with a sink.
      - name: Install frontend packages
        run: yarn install --frozen-lockfile

      - name: Install the probe harness
        working-directory: .devtools/frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Demo mode seeds a database and auto-logs-in, which is what the probe needs: it
      # drives real pages as a real session. Migrating first is required - a request no
      # longer migrates the database - and the first GET / is what generates the demo data.
      #
      # The config is written rather than copied from config-dist.php, which is what this
      # step used to do: the distributed defaults name a PostgreSQL server on localhost with
      # no password, and the one this job has is the service container above.
      - name: Boot a demo instance
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: victual
          PGPASSWORD: victual
        run: |
          VDATA=$(mktemp -d)
          cat > "$VDATA/config.php" <<'PHPCONFIG'
          <?php
          Setting('DB_DRIVER', 'pgsql');
          Setting('DB_HOST', getenv('PGHOST'));
          Setting('DB_PORT', intval(getenv('PGPORT')));
          Setting('DB_NAME', 'victual');
          Setting('DB_USER', getenv('PGUSER'));
          Setting('DB_PASSWORD', getenv('PGPASSWORD'));
          PHPCONFIG
          VICTUAL_MODE=demo VICTUAL_DATAPATH="$VDATA" php bin/victual-migrate --quiet
          VICTUAL_MODE=demo VICTUAL_DATAPATH="$VDATA" \
            php -S 127.0.0.1:8085 -t public > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then break; fi
            sleep 1
          done
          # Demo generation runs on that first request and takes a few seconds; the probe
          # seeds through the API and would race it.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/stockoverview || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          curl -sS -o /dev/null -w 'stockoverview -> %{http_code}\n' http://127.0.0.1:8085/stockoverview

      - name: Run the S29 payload probe
        working-directory: .devtools/frontend
        run: node s29-payload.js --url http://127.0.0.1:8085 --out s29-payload-ci.json

      - name: Run role form and inheritance checks
        working-directory: .devtools/frontend
        run: node roles.js http://127.0.0.1:8085

      # Plan 03. The form field and the short-group list are both things the PHP phase
      # structurally cannot see: it asserts the column and the controller's row set, and this
      # asserts that a person can set the value and act on the result. A probe nothing runs is
      # documentation, which is the lesson this job's own header records.
      - name: Run product group minimum stock checks
        working-directory: .devtools/frontend
        run: node group-min-stock.js http://127.0.0.1:8085

      - name: Run label printer administration checks
        working-directory: .devtools/frontend
        run: node label-printers.js --url http://127.0.0.1:8085

      - name: Run location label scan checks
        working-directory: .devtools/frontend
        run: node location-labels.js --url http://127.0.0.1:8085

      - name: Run location print action checks
        working-directory: .devtools/frontend
        run: node location-print.js --url http://127.0.0.1:8085

      - name: Run label designer checks
        working-directory: .devtools/frontend
        run: node label-designer.js --url http://127.0.0.1:8085

      # Uploaded on failure: the per-probe reasons are in the log, but the JSON carries
      # what was stored and read back, which is what tells a reader whether a failing probe
      # found a real sink or a broken seed.
      - name: Upload the probe report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s29-payload
          path: .devtools/frontend/s29-payload-ci.json
          if-no-files-found: warn

      - name: The server log, if anything went wrong
        if: failure()
        run: tail -50 /tmp/php-server.log || true

  images:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the dev image now. This job used to build the `Dockerfile`'s `production`
      # target as well and assert five things about it; ADR-0013 was accepted on
      # 2026-09-04 and production images are built by Nix, so those assertions moved
      # rather than disappeared. Where each one went:
      #
      #   not root                     -> nix/checks.nix `image-runs-unprivileged`, and
      #                                   the `nix` workflow's boot test reads it back off
      #                                   the running container
      #   view cache baked, unwritable -> nix/checks.nix `viewcache-is-warm`, and the boot
      #                                   test probes the write
      #   no .git or data/             -> nix/source.nix is an allowlist, so neither can
      #                                   arrive by being forgotten; `app-is-complete`
      #                                   asserts what is there
      #   read-only rootfs, serving    -> the `nix` workflow's boot test, which is the one
      #                                   assertion `nix flake check` structurally cannot
      #                                   make
      #   /tmp, upload limits, spill   -> the same boot test
      #
      # The dev image is still built here because the suite runs in it and a broken dev
      # image should be found by CI rather than by the next person who runs the suite.
      - name: Build the development image
        run: docker build -t victual:dev .

      - name: The dev image can run the tools it exists for
        run: |
          set -euo pipefail
          docker run --rm victual:dev php -v
          docker run --rm victual:dev php -r 'exit(extension_loaded("pdo_pgsql") && extension_loaded("pdo_sqlite") ? 0 : 1);'
          docker run --rm victual:dev sh -c 'command -v psql >/dev/null && command -v createdb >/dev/null'
          echo "php, both PDO drivers, and the PostgreSQL client are present"
