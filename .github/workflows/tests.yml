# The differential test suite, on every pull request with non-Markdown changes.
#
# What this gates is the one thing this fork can most easily break without noticing:
# that the application behaves identically on SQLite and PostgreSQL. A view that quietly
# returns different rows on one engine is invisible in review and obvious here.
#
# The suite is deliberately not run on the repository's Dockerfile. That image exists so a
# contributor can run the suite locally without installing PHP and PostgreSQL by hand;
# CI already has both, and building an image on every pull request would add minutes to
# the feedback loop for no extra coverage. Both paths run the same runner script, so
# there is one definition of what "the suite" means.
#
# The development image is built in its own job; production images use nix.yml.

name: tests

# The token needs to read the repository and nothing else: no job here writes to it, and
# the coverage upload goes through the artifact API, which contents: read covers. Named
# explicitly so the default grant never applies (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # check_deploy_manifest.py is the one script under .devtools/ci that parses a
      # real document format rather than treating text as regex input, so it is the
      # one with a dependency. PyYAML is pure Python and has no build step.
      - name: Install manifest-check dependencies
        run: pip install --quiet pyyaml==6.0.1

      - name: Check CI validation scripts
        run: python3 -m unittest discover -s .devtools/ci

      - name: Check changed ADR headers
        run: python3 .devtools/ci/check_adr_headers.py

      # ADR-0010 property 3 (unprivileged) and property 4 (declared, with probes and
      # limits) as they apply to deploy/**'s manifests rather than to the images
      # nix/checks.nix already covers. This runs unconditionally, on the whole
      # deploy/** tree, rather than being folded into the nix workflow's path filter:
      # a manifest is not a Nix build input, so gating it behind a full image rebuild
      # would answer a YAML-only change with a ten-minute job. See
      # docs/adr/0010-workload-standard.md open question 2.
      - name: Check deploy manifests
        run: python3 .devtools/ci/check_deploy_manifest.py

      # There is no configured linter in this repository, so this is a syntax sweep
      # rather than a style check. It is cheap and it catches the parse error that
      # would otherwise fail every job below with a much less obvious message.
      # php -l writes both its success line and its parse errors to stdout, so the
      # output is captured rather than discarded: discarding it hides the filename and
      # leaves a failing job showing nothing but an exit code.
      - name: Check PHP syntax
        run: |
          if ! find . -name '*.php' \
              -not -path './packages/*' \
              -not -path './public/packages/*' \
              -print0 \
            | xargs -0 -n1 -P4 php -l > lint.log 2>&1; then
            grep -v '^No syntax errors detected' lint.log
            exit 1
          fi

      # The frontend twin of the syntax sweep above. public/packages is yarn-installed
      # (gitignored, and absent in a bare checkout) rather than this fork's own code, so
      # it is excluded the same way php -l excludes packages/. Plan 14 piece 3 names this
      # check; 15-C14 is what actually wired it in.
      - name: Check JS syntax
        run: |
          if ! find public -name '*.js' \
              -not -path 'public/packages/*' \
              -print0 \
            | xargs -0 -n1 -P4 node --check > jslint.log 2>&1; then
            cat jslint.log
            exit 1
          fi

      # SQL assembled inside PHP is invisible to the view/trigger differential suite.
      # Keep SQLite-only functions out of request-time queries so PostgreSQL does not
      # discover them as a user-facing 400 or 500.
      - name: Check runtime SQL portability
        run: php .devtools/pgsql/check-runtime-sql.php

      # Every CI job the documentation names has to exist. The `frontend-security` job
      # below was described in four documents for a day before it was written, and while
      # it did not exist nobody looked for the gate it claimed to be. See
      # docs/plans/landed/21-frontend-sink-discipline.md and the script's own header.
      - name: Every cited CI job exists
        run: php .devtools/check-cited-jobs.php

      # The documentation site. Two checks, because they see different halves of the
      # link graph: the staging script fails on a link it rewrote to a repository URL
      # that names nothing (--strict cannot see an absolute URL), and --strict fails on
      # a broken relative link or a page missing from the nav. No container runtime and
      # no PHP are needed: the staging script omits the API reference when it finds
      # neither, which is the same path a contributor without Docker takes. See
      # docs/plans/landed/26-documentation-site.md.
      - name: Build the documentation site
        run: |
          pip install --quiet --requirement .devtools/docs/requirements.txt
          python3 .devtools/docs/stage.py --no-api
          mkdocs build --strict --site-dir /tmp/docs-site

  suite:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest

    # Fixed rather than left to run-tests.sh's own default (${TMPDIR:-/tmp}/victual-suite)
    # so the label test steps below — which run-tests.sh never sees, since they are their
    # own workflow steps — know where to find the coverage-ini directory and the .cov
    # files it left behind, and can add to them instead of measuring in isolation.
    env:
      SUITE_SCRATCH: /tmp/victual-suite

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: victual
          POSTGRES_PASSWORD: victual
          POSTGRES_DB: victual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U victual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 8.4 is the fork's real language floor, and composer.json/PrerequisiteChecker
      # declare it too since 15-C7.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype
          # pcov rather than the default none, so the run below can report what the
          # suite reached. It only collects when a process asks it to.
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      # PathParameterMiddleware reads which path parameters are integer ids out of
      # victual.openapi.json, so an undocumented parameter is an unvalidated one - and an
      # unvalidated id reached PostgreSQL as a type error, answering 500 with the failing
      # statement in the body. See issue #48.
      #
      # In this job rather than in `lint` because it registers the real route table
      # instead of parsing routes.php with a regular expression - what the application
      # actually serves is the route table, and a check that reads the file would
      # disagree with it the first time a route is written in a way the pattern did not
      # anticipate. Registering means booting Slim, and `lint` deliberately installs no
      # dependencies. It runs before the suite because it is the cheaper of the two and
      # its failure is the easier one to read.
      - name: Every API path parameter is typed
        run: php .devtools/check-path-id-validation.php

      # ADR-0025 tier 2. pg_prove is a Perl script (this runner, not the postgres
      # service), and the pgtap extension itself installs into the service's database
      # per decision 6: the stock postgres:16 image does not ship it, and production
      # images (built by nix, never by this workflow) get no surface for it at all.
      - name: Install pg_prove
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libtap-parser-sourcehandler-pgtap-perl

      - name: Install the pgtap extension into the postgres service
        run: |
          container=$(docker ps -q --filter ancestor=postgres:16)
          docker exec "$container" bash -c 'apt-get update && apt-get install -y --no-install-recommends postgresql-16-pgtap'

      # The workflow calls the same entry point a contributor runs locally, rather than
      # restating the commands. A suite that drifts from the one people run by hand is
      # a suite nobody trusts.
      #
      # This step's own coverage report is interim: it runs before the label phases below,
      # which now measure into the same directory, so it undercounts what the job as a
      # whole reaches. Nothing is gated here for that reason — the "Enforce the coverage
      # ratchet" step near the end of this job is the one that counts, and is where the
      # maintainer's chosen threshold (docs/constitution.md) is actually checked.
      - name: Run the differential test suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: victual
          PGPASSWORD: victual
          SUITE_COVERAGE: 1
          SUITE_COVERAGE_CLOVER: clover.xml
        run: .devtools/pgsql/run-tests.sh

      # Node is on the runner, and the differential half of this needs it: the ECMAScript
      # oracle is correct by construction and a PHP reimplementation of it would only be a
      # second thing to be wrong.
      # Issue 192 mechanics item 2's first remaining process. The differential half of this
      # needs Node, and the ECMAScript oracle is correct by construction — a PHP
      # reimplementation of it would only be a second thing to be wrong. What changed here is
      # only that it now measures into the same directory as everything else: CanonicalJson
      # is 2068 documents' worth of exercise that the number never saw.
      - name: RFC 8785 canonicalization
        env:
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: canonical-json
        run: php .devtools/labels/canonical-json-tests.php

      # PathParameterMiddleware needs no database (see its constructor's own docblock),
      # so this is a plain script rather than a run-tests.sh phase - but it still needs
      # SUITE_COVERAGE's auto_prepend_file wiring to land in the same coverage directory
      # as everything else, the same reason the label phases below carry these two env
      # vars. Drives a real (throwaway) Slim dispatch through the middleware rather than
      # calling its private methods directly, over the route pattern this PR renamed in
      # victual.openapi.json - the regression a rename without updating the
      # middleware's own FastRoute-constraint stripping would reintroduce.
      - name: Path parameter validation middleware
        env:
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: path-parameter
        run: php .devtools/middleware/path-parameter-tests.php

      # Issue 192 mechanics item 2: this phase drives Services\Labels\LabelIdentityService
      # directly and used to do it outside SUITE_COVERAGE, so the coverage number never saw
      # it. Same auto_prepend_file mechanism run-tests.sh set up above, pointed at the same
      # coverage directory so its .cov files are merged with the differential suite's
      # rather than measured in isolation.
      - name: Label identity and import concurrency
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: label-identity
        run: php .devtools/labels/identity-tests.php

      # Same reason as the identity phase above: this is most of TemplateDocument and
      # FieldCatalogue's real exercise, and it was invisible to the coverage number until now.
      - name: Label templates, renders and artifacts
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: label-artifacts
        run: php .devtools/labels/artifact-tests.php

      - name: Label print jobs and fences
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: label-print-jobs
        run: php .devtools/labels/print-job-tests.php

      - name: Label kinds (plan 32 - product, stock_entry, recipe, chore, battery)
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: label-kinds
        run: php .devtools/labels/kinds-tests.php

      # The check neither repository can make alone: the real renderer's output, fed to the
      # verifier that will accept or refuse it in production. Both would pass on their own if
      # each were wrong about the same axis in the same direction, which is the defect the
      # 2026-09-07 renderer comparison actually found in two candidates.
      #
      # The revision is the one flake.lock pins, so this checks the binary the images are
      # built from rather than whatever is on the renderer's main branch today.
      - name: Check out the pinned renderer
        uses: actions/checkout@v4
        with:
          repository: datagen24/victual-label-renderer
          ref: f05c432f7857f976e0223296f968d641fa401254
          path: .agreement

      - name: Build the pinned renderer
        working-directory: .agreement
        run: cargo build --release

      - name: The renderer and the verifier agree about geometry
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_RENDERER_BIN: .agreement/target/release/victual-label-renderer
          VICTUAL_RENDERER_FONT: .agreement/tests/fixtures/NotoSans-Regular.ttf
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: renderer-agreement
        run: php .devtools/labels/renderer-agreement-tests.php

      - name: Label worker API and credentials
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: label-worker-api
        run: php .devtools/labels/worker-api-tests.php

      - name: Label registry and configuration
        env:
          LABEL_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=victual'
          PGUSER: victual
          PGPASSWORD: victual
          VICTUAL_COVERAGE_DIR: ${{ env.SUITE_SCRATCH }}/coverage
          PHP_INI_SCAN_DIR: ':${{ env.SUITE_SCRATCH }}/coverage-ini'
          VICTUAL_COVERAGE_LABEL: label-registry
        run: php .devtools/labels/registry-tests.php

      # Issue 192's first gate: a ratchet, not the 75% floor. run-tests.sh already printed
      # an interim report before the label phases above ran; this is the one that counts,
      # over every .cov file the whole job left behind, including theirs. --min is raised by
      # hand as the number climbs — this PR's own run of this job (f6e7225, 2026-09-17)
      # reported 4824 of 10199 executable lines, 47.29875477988038% exactly, with both
      # fixes above in place, up from the 37.81% master measured at 6133e15 before them.
      # --min is that full figure, not a rounded one: a bare 47 lets a one-line regression
      # through in either direction (losing a covered line reads 47.28895%, adding an
      # uncovered one reads 47.29412%), and even 47.298 still admits a regression that
      # changes both counts together — deleting a two-line, one-covered file reads
      # 4823/10197 = 47.298225%, which is below the true baseline but still ≥ 47.298 (both
      # caught in review on this PR). Only the exact figure closes that gap. A pull request
      # that lowers the true number fails here; the hard floor of 75% is issue 192's last
      # step, once the backlog in it is retired.
      # The instrument's own controls, ahead of the step that reads it. A directory whose
      # expected steps are all present proves nothing unless a missing one would have been
      # caught, so this runs both negatives — the prepend path disabled and the driver
      # absent — against a directory that already holds another step's file. It needs no
      # database and no fixtures; it is about the measurement, not about what is measured.
      - name: The coverage instrument notices a step it lost
        run: php .devtools/coverage/expectation-tests.php

      # Issue 192's first gate: a ratchet, not the 75% floor. run-tests.sh already printed
      # an interim report before the label phases above ran; this is the one that counts,
      # over every .cov file the whole job left behind, including theirs. --min is raised by
      # hand as the number climbs, and is the exact figure rather than a rounded one: a bare
      # 64 lets a one-line regression through in either direction, and even a three-decimal
      # figure admits a regression that moves both counts together (deleting a two-line,
      # one-covered file lowers the numerator and the denominator at once). Only the full
      # figure, matched against what report.php computes at runtime from the same counts,
      # closes that gap. A pull request that lowers the true number fails here; the hard
      # floor of 75% is issue 192's last step, once the backlog in it is retired.
      #
      # --expect names every step that measures into this directory outside run-tests.sh.
      # Without it a step that silently stopped being measured — a lost PHP_INI_SCAN_DIR, a
      # driver that failed to load — reads as an honest zero gain and fails nothing, which
      # is the specific failure issue 192 mechanics item 2 asks to be made visible.
      - name: Enforce the coverage ratchet
        run: |
          env -u VICTUAL_COVERAGE_DIR php .devtools/coverage/report.php \
            "$SUITE_SCRATCH/coverage" --clover=clover.xml \
            --expect=canonical-json,renderer-agreement,path-parameter,label-identity,label-artifacts,label-print-jobs,label-kinds,label-worker-api,label-registry \
            --min=RATCHET_PLACEHOLDER

      # The per-file half of the same evidence. Aggregate --min cannot see a file that fell
      # while another rose, and the floor is stated per file as well as in total
      # (docs/constitution.md). Printed rather than gated: plan 33's M3 leaves automated
      # per-file enforcement optional, so this is what a reviewer reads in the log, and what
      # a pull request's Verification section quotes.
      - name: Which files are below the floor
        if: always()
        run: php .devtools/coverage/inventory.php clover.xml

      # Uploaded even when the suite fails: which code a failing run did and did not
      # reach is part of reading the failure.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: clover.xml
          if-no-files-found: warn

  # The oldest PostgreSQL the application starts on, tested rather than declared.
  # PostgresDialect::MINIMUM_MAJOR_VERSION is the number this job runs; the `suite` job above
  # runs the newest one. Raising the minimum means changing the image here in the same
  # commit: the `serverversion` phase fails when the constant is raised past this job's
  # server. Lowering it is not caught, so lower the image with it. The differential suite
  # only: the coverage ratchet and the label worker steps are measured once, in `suite`.
  suite-floor:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest

    env:
      SUITE_SCRATCH: /tmp/victual-suite

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: victual
          POSTGRES_PASSWORD: victual
          POSTGRES_DB: victual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U victual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Install pg_prove
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libtap-parser-sourcehandler-pgtap-perl

      - name: Install the pgtap extension into the postgres service
        run: |
          container=$(docker ps -q --filter ancestor=postgres:15)
          docker exec "$container" bash -c 'apt-get update && apt-get install -y --no-install-recommends postgresql-15-pgtap'

      - name: Run the differential test suite on the minimum PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: victual
          PGPASSWORD: victual
        run: .devtools/pgsql/run-tests.sh

  # The gate this repository has claimed to run since 2026-09-03 and did not: sweep S29's
  # payload probe, which asserts that no page executes a payload it is asked to display.
  # Three documents described this job before it existed, and in the gap two sinks of
  # exactly the class S29 closed reached master and stayed open until an external scanner
  # reported them. See docs/plans/landed/21-frontend-sink-discipline.md.
  frontend-security:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest

    # The probe drives a demo instance, and since ADR-0008's retirement a demo instance is a
    # PostgreSQL one: DB_DRIVER no longer accepts "sqlite", and DemoDataGeneratorService is
    # portable so that this mode still has an engine to run on. The job therefore needs a
    # database where it previously needed a file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: victual
          POSTGRES_PASSWORD: victual
          POSTGRES_DB: victual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U victual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 8.5, not the 8.4 the suite job uses. This one boots the application through
      # public/index.php, where PrerequisiteChecker enforces REQUIRED_PHP_VERSION (8.4,
      # since 15-C7) - 8.5 is what the serving image actually ships (plan 15-C7 Q4), and
      # this job matches that rather than the declared floor.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-frontend-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      # The views load their CSS and JS from /packages/..., and .yarnrc points yarn at
      # public/packages. Without them the pages boot unstyled and, more to the point, with
      # no jQuery - so every probe would report "the sink was never reached" and the job
      # would fail for a reason that has nothing to do with a sink.
      - name: Install frontend packages
        run: yarn install --frozen-lockfile

      - name: Install the probe harness
        working-directory: .devtools/frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Demo mode seeds a database and auto-logs-in, which is what the probe needs: it
      # drives real pages as a real session. Migrating first is required - a request no
      # longer migrates the database - and the first GET / is what generates the demo data.
      #
      # The config is written rather than copied from config-dist.php, which is what this
      # step used to do: the distributed defaults name a PostgreSQL server on localhost with
      # no password, and the one this job has is the service container above.
      - name: Boot a demo instance
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: victual
          PGPASSWORD: victual
        run: |
          VDATA=$(mktemp -d)
          cat > "$VDATA/config.php" <<'PHPCONFIG'
          <?php
          Setting('DB_DRIVER', 'pgsql');
          Setting('DB_HOST', getenv('PGHOST'));
          Setting('DB_PORT', intval(getenv('PGPORT')));
          Setting('DB_NAME', 'victual');
          Setting('DB_USER', getenv('PGUSER'));
          Setting('DB_PASSWORD', getenv('PGPASSWORD'));
          PHPCONFIG
          VICTUAL_MODE=demo VICTUAL_DATAPATH="$VDATA" php bin/victual-migrate --quiet
          VICTUAL_MODE=demo VICTUAL_DATAPATH="$VDATA" \
            php -S 127.0.0.1:8085 -t public > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then break; fi
            sleep 1
          done
          # Demo generation runs on that first request and takes a few seconds; the probe
          # seeds through the API and would race it.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/stockoverview || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          curl -sS -o /dev/null -w 'stockoverview -> %{http_code}\n' http://127.0.0.1:8085/stockoverview

      # A second instance, and it has to be a second one. The demo instance above cannot
      # carry the label subsystem: enabling it requires FILE_STORAGE "database", and
      # ConfigurationValidator refuses that in demo mode because demo instances share a
      # storage location by file name suffix and the files table has no column for it
      # (plan 01 Q4). checkLabelSubsystem() refuses the combination for the same reason and
      # says so directly.
      #
      # It exists because FEATURE_FLAG_LABELS defaults to false, so the print action's branch
      # of locations.blade.php and locationform.blade.php was rendered by nothing - and a
      # TypeError in exactly that branch reached a running instance while every check here
      # stayed green.
      - name: Boot a labels instance
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: victual
          PGPASSWORD: victual
        run: |
          PGPASSWORD=$PGPASSWORD createdb -h $PGHOST -p $PGPORT -U $PGUSER victual_labels
          LDATA=$(mktemp -d)
          cat > "$LDATA/config.php" <<'PHPCONFIG'
          <?php
          Setting('DB_DRIVER', 'pgsql');
          Setting('DB_HOST', getenv('PGHOST'));
          Setting('DB_PORT', intval(getenv('PGPORT')));
          Setting('DB_NAME', 'victual_labels');
          Setting('DB_USER', getenv('PGUSER'));
          Setting('DB_PASSWORD', getenv('PGPASSWORD'));
          Setting('FEATURE_FLAG_LABELS', true);
          Setting('FILE_STORAGE', 'database');
          PHPCONFIG
          VICTUAL_MODE=dev VICTUAL_DATAPATH="$LDATA" php bin/victual-migrate --quiet
          VICTUAL_MODE=dev VICTUAL_DATAPATH="$LDATA" \
            php -S 127.0.0.1:8087 -t public > /tmp/php-labels.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/locations || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          curl -sS -o /dev/null -w 'labels instance /locations -> %{http_code}\n' http://127.0.0.1:8087/locations

      - name: Run the S29 payload probe
        working-directory: .devtools/frontend
        run: node s29-payload.js --url http://127.0.0.1:8085 --out s29-payload-ci.json

      - name: Run role form and inheritance checks
        working-directory: .devtools/frontend
        run: node roles.js http://127.0.0.1:8085

      # Plan 03. The form field and the short-group list are both things the PHP phase
      # structurally cannot see: it asserts the column and the controller's row set, and this
      # asserts that a person can set the value and act on the result. A probe nothing runs is
      # documentation, which is the lesson this job's own header records.
      - name: Run product group minimum stock checks
        working-directory: .devtools/frontend
        run: node group-min-stock.js http://127.0.0.1:8085

      # Plan 08. Against the demo instance on 8085 rather than the labels instance on 8087:
      # nothing here needs the label subsystem, and the demo instance is the one the other
      # location-shaped page checks already run against. The parent picker, the freezer
      # default, the path in a picker and the roll-up in the overview filter are all things
      # the PostgreSQL phase structurally cannot see - it asserts the column, the view, the
      # guards and the API, and this asserts that a person can build a tree and act on it.
      - name: Run nested location checks
        working-directory: .devtools/frontend
        run: node nested-locations.js http://127.0.0.1:8085

      # Plan 30. Against the demo instance on 8085 for the same reason the nested location
      # checks are: the parent picker, the path shown in a group dropdown, and the delete
      # refusal reaching the page are all things the PostgreSQL phase structurally cannot see -
      # it asserts the column, the view, the guards and the API, and this asserts that a
      # person can build a tree through the form and act on it.
      - name: Run nested product group checks
        working-directory: .devtools/frontend
        run: node nested-product-groups.js http://127.0.0.1:8085

      # Plan 31. Against the demo instance on 8085 for the same reason the nested product
      # group checks are: the product form's Substitutions table rendering the right direction
      # sentence and a link to the other product, and the delete confirm/reload flow reaching
      # the page, are things the PostgreSQL phase structurally cannot see. The edge itself is
      # created through the API as fixture data rather than through the "Add" dialog's product
      # picker (a bootstrap-combobox typeahead) - see this probe's own header comment for why.
      - name: Run product substitution checks
        working-directory: .devtools/frontend
        run: node product-substitutions.js http://127.0.0.1:8085

      # Plan 28. Against the demo instance on 8085 - nothing here needs the label subsystem
      # either. The modal actually opening in the right mode, posting the nested measurement
      # object rather than flat fields, the tare field's visibility following the gross
      # checkbox, and the row summary text (built via .text() alone, S29's own discipline
      # applied to a quantity unit name) are all things the PostgreSQL phase structurally
      # cannot see - it asserts the column, the coherence CHECK, the write path and the API,
      # and this asserts that a person can open a container, measure it and read the result
      # back. docs/plans/landed/28-open-container-measurement.md's own verification asks for this
      # probe by name, and for it to be invoked here rather than merely placed beside the
      # others - plan 08's Executed section records that exact distinction being missed once
      # already.
      - name: Run open container measurement checks
        working-directory: .devtools/frontend
        run: node open-container-measurement.js http://127.0.0.1:8085

      # Plan 29. The tare fields on the location form, the one-tap refill fields on the
      # product form, and the location shortfall list with its refill button are all things
      # the PostgreSQL phase structurally cannot see - it asserts the column, the view and
      # the service methods, and this asserts that a person can configure a vessel and a
      # refill through the pages and that clicking the button actually moves stock.
      - name: Run working container replenishment checks
        working-directory: .devtools/frontend
        run: node working-container.js http://127.0.0.1:8085

      # Issue 159, found while implementing plan 29 and unrelated to it: productform.js always
      # sent every nullable-integer picker's field even when nothing was picked, and an
      # untouched <select> serializes to "" - which PostgreSQL refuses for the integer column
      # underneath, arriving at the browser as an opaque 400. A bare create is exactly the
      # ordinary use nothing else here drives the form through, so nothing caught it until this
      # probe did.
      - name: Run product form nullable picker checks
        working-directory: .devtools/frontend
        run: node product-nullable-pickers.js http://127.0.0.1:8085

      - name: Run label printer administration checks
        working-directory: .devtools/frontend
        run: node label-printers.js --url http://127.0.0.1:8087

      - name: Run location label scan checks
        working-directory: .devtools/frontend
        run: node location-labels.js --url http://127.0.0.1:8085

      - name: Run location print action checks
        working-directory: .devtools/frontend
        run: node location-print.js --url http://127.0.0.1:8087

      - name: Run label designer checks
        working-directory: .devtools/frontend
        run: node label-designer.js --url http://127.0.0.1:8087

      # Uploaded on failure: the per-probe reasons are in the log, but the JSON carries
      # what was stored and read back, which is what tells a reader whether a failing probe
      # found a real sink or a broken seed.
      - name: Upload the probe report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s29-payload
          path: .devtools/frontend/s29-payload-ci.json
          if-no-files-found: warn

      - name: The server log, if anything went wrong
        if: failure()
        run: tail -50 /tmp/php-server.log || true

  # The MCP sidecar's own tests (mcp/tests/tools): handler shaping against recorded
  # response shapes, and the HTTP face against a fake Victual over real sockets. The Nix
  # build of the same package runs in nix.yml; this is the fast feedback half.
  mcp:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The major nix/mcp.nix builds and ships (nodejs_24), so CI tests what runs.
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  images:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the dev image now. This job used to build the `Dockerfile`'s `production`
      # target as well and assert five things about it; ADR-0013 was accepted on
      # 2026-09-04 and production images are built by Nix, so those assertions moved
      # rather than disappeared. Where each one went:
      #
      #   not root                     -> nix/checks.nix `image-runs-unprivileged`, and
      #                                   the `nix` workflow's boot test reads it back off
      #                                   the running container
      #   view cache baked, unwritable -> nix/checks.nix `viewcache-is-warm`, and the boot
      #                                   test probes the write
      #   no .git or data/             -> nix/source.nix is an allowlist, so neither can
      #                                   arrive by being forgotten; `app-is-complete`
      #                                   asserts what is there
      #   read-only rootfs, serving    -> the `nix` workflow's boot test, which is the one
      #                                   assertion `nix flake check` structurally cannot
      #                                   make
      #   /tmp, upload limits, spill   -> the same boot test
      #
      # The dev image is still built here because the suite runs in it and a broken dev
      # image should be found by CI rather than by the next person who runs the suite.
      - name: Build the development image
        run: docker build -t victual:dev .

      - name: The dev image can run the tools it exists for
        run: |
          set -euo pipefail
          docker run --rm victual:dev php -v
          docker run --rm victual:dev php -r 'exit(extension_loaded("pdo_pgsql") && extension_loaded("pdo_sqlite") ? 0 : 1);'
          docker run --rm victual:dev sh -c 'command -v psql >/dev/null && command -v createdb >/dev/null'
          echo "php, both PDO drivers, and the PostgreSQL client are present"
