# The Nix build, on every pull request that touches it.
#
# ADR-0013 makes Nix the production image builder. This workflow builds and boots
# the three images when the configured build inputs change.
#
# It runs on Linux, so it needs none of the podman-hosted builder that
# `nix/build-in-podman.sh` exists for on a Mac. That script and this workflow build the
# same three attributes from the same flake; the difference is only where the Linux is.
#
# Paths are filtered because a full build from source is minutes: PHP is rebuilt rather
# than substituted, since nix/php.nix overrides the derivation to drop the PEAR scripts and
# the sendmail reference that put a shell in the runtime closure. A change that cannot
# affect the images should not pay for that.

name: nix

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '!nix/**/*.md'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'yarn.lock'
      - 'version.json'
      - '.github/workflows/nix.yml'
      - '.github/workflows/changes.yml'
      - '.devtools/ci/**'
      - '.devtools/nix/**'
      - 'deploy/postgres/**'
  push:
    branches: [master]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '!nix/**/*.md'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'yarn.lock'
      - 'version.json'
      - '.github/workflows/nix.yml'
      - '.github/workflows/changes.yml'
      - '.devtools/ci/**'
      - '.devtools/nix/**'
      - 'deploy/postgres/**'

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  flake:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The lock file is the pin that makes "reproducible" mean anything, and a build that
      # silently updates it is not reproducing anything. --no-update-lock-file turns a
      # stale lock into a failure here rather than a surprise later.
      - name: Check the flake is locked
        run: nix flake metadata --no-update-lock-file

      # The 34 assertions in nix/checks.nix. Three of them are why this job is worth its
      # minutes: the runtime closure contains no shell, the web tier's closure does not
      # contain the application, and the baked view cache is actually warm. Each is a
      # property of the artifact rather than of the file describing it, and each has already
      # caught something — the no-shell check found three separate paths by which bash
      # reached the app image (PEAR's wrapper scripts, PHP's sendmail reference, and libavif's
      # gdk-pixbuf thumbnailer via gd).
      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Build the three images
        run: |
          nix build .#image-app .#image-web .#image-migrate --print-build-logs --no-link

      # Loading them proves the streamer produces something a runtime accepts, which
      # building alone does not: streamLayeredImage writes a tar to stdout and a malformed
      # one fails here rather than on somebody's laptop.
      - name: Load them into the local runtime
        run: |
          for img in image-app image-web image-migrate; do
            "$(nix build ".#$img" --no-link --print-out-paths)" | docker load
          done
          docker images --filter reference='victual-*'

      # --- The boot test ----------------------------------------------------------------
      #
      # This is the half of the retired `images` job that had nowhere else to go. Four of
      # its five assertions about the Dockerfile's production image have `nix flake check`
      # equivalents, which are stronger because they are properties of the artifact rather
      # than of a running copy of it. The fifth does not and cannot: whether a read-only
      # root filesystem actually holds is a statement about a kernel, a mount table and an
      # application that has served a request, and no amount of evaluation reaches it.
      #
      # ADR-0013's Consequences said these assertions "move rather than disappear". This is
      # where they moved, and plan 20's verification section is the longer form of it.
      - name: Start PostgreSQL
        run: |
          docker run -d --name victual-db \
            -e POSTGRES_USER=victual -e POSTGRES_PASSWORD=victual -e POSTGRES_DB=victual \
            -p 5432:5432 postgres:16
          for _ in $(seq 1 60); do
            if docker exec victual-db pg_isready -U victual >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec victual-db pg_isready -U victual

      # The credential split, exactly as an operator applies it (plan 20 verification 8): the
      # `victual` superuser above exists only to bootstrap the database, and nothing below
      # connects as it. The migrate container gets the role that owns the schema, the app
      # container the one that cannot run DDL.
      #
      # The two passwords are made up per run rather than written here: they protect a database
      # that lives for the length of this job, and a literal in a workflow is what a secret
      # scanner is right to flag whatever it protects.
      - name: Create the two database roles
        run: |
          migrate_pw=$(openssl rand -hex 16)
          app_pw=$(openssl rand -hex 16)
          echo "::add-mask::$migrate_pw"
          echo "::add-mask::$app_pw"
          echo "CI_MIGRATE_PASSWORD=$migrate_pw" >> "$GITHUB_ENV"
          echo "CI_APP_PASSWORD=$app_pw" >> "$GITHUB_ENV"
          docker exec -i victual-db psql -q -v ON_ERROR_STOP=1 -U victual -d victual \
            -v db=victual -v migrate_password="$migrate_pw" -v app_password="$app_pw" \
            < deploy/postgres/roles.sql

      - name: The images declare a non-root user
        run: |
          set -euo pipefail
          for img in victual-app victual-web victual-migrate; do
            user=$(docker inspect --format '{{.Config.User}}' "$img:4.6.0")
            echo "$img runs as $user"
            test "$user" = "65532:65532"
          done

      # `docker inspect`, not `id -un`: these images have no shell and no coreutils, which
      # is the point. The assertion that used to run `id` inside the container is the
      # assertion that could only be written against a Debian image.
      - name: Migrate, then serve
        run: |
          set -euo pipefail

          docker network create victual-ci
          docker network connect victual-ci victual-db

          env_args=(
            -e VICTUAL_MODE=production
            -e VICTUAL_DB_DRIVER=pgsql
            -e VICTUAL_DB_HOST=victual-db
            -e VICTUAL_DB_PORT=5432
            -e VICTUAL_DB_NAME=victual
            -e VICTUAL_FILE_STORAGE=database
            -e VICTUAL_BASE_URL=http://127.0.0.1:8080
          )
          migrate_env=(-e VICTUAL_DB_USER=victual_migrate -e "VICTUAL_DB_PASSWORD=$CI_MIGRATE_PASSWORD")
          app_env=(-e VICTUAL_DB_USER=victual_app -e "VICTUAL_DB_PASSWORD=$CI_APP_PASSWORD")

          # The initContainer, as a one-shot run. Read-only from the start: if the
          # migration needed to write anything outside /tmp this fails here rather than
          # leaving a half-migrated database behind.
          docker run --rm --name victual-migrate-run \
            --network victual-ci --read-only --tmpfs /tmp:rw,mode=1777 \
            "${env_args[@]}" "${migrate_env[@]}" victual-migrate:4.6.0

          # The two serving containers share a network namespace exactly as they do in the
          # pod, which is what makes 127.0.0.1:9000 mean the same thing here as in k3s.
          # Published on the runner's loopback so the walk below can reach nginx; the two
          # in-container probes still run inside, which is where their answer is available.
          docker run -d --name victual-app \
            --network victual-ci --read-only --tmpfs /tmp:rw,mode=1777 \
            -p 127.0.0.1:8080:8080 \
            "${env_args[@]}" "${app_env[@]}" victual-app:4.6.0

          docker run -d --name victual-web \
            --network "container:victual-app" --read-only --tmpfs /tmp:rw,mode=1777 \
            victual-web:4.6.0

          # Both probes run inside the containers, which is the only place the answer is
          # available: php-fpm binds loopback and nginx is in the app container's network
          # namespace. Nothing is published to the runner, and nothing needs to be.
          for _ in $(seq 1 60); do
            if docker exec victual-app /opt/victual/healthcheck >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec victual-app /opt/victual/healthcheck
          docker exec victual-web /opt/victual/webcheck /robots.txt
          docker exec victual-web /opt/victual/webcheck /login
          echo "php-fpm is accepting connections and nginx served /robots.txt and /login"

      - name: The read-only root filesystem holds
        run: |
          set -euo pipefail
          # The app image's own PHP, not the migrate image's: those are different store
          # paths, because migrate carries pdo_sqlite and the serving images do not. The
          # CLI sits beside php-fpm in the same buildEnv.
          php="$(dirname "$(docker inspect --format '{{index .Config.Cmd 0}}' victual-app:4.6.0)")/php"

          # Writes outside /tmp must fail; /tmp is the one writable mount.
          docker exec victual-app "$php" -r '
            foreach (["/opt/probe", "/etc/probe", "/data/probe"] as $path) {
              if (@file_put_contents($path, "x") !== false) {
                fwrite(STDERR, "wrote to $path on a read-only root filesystem\n");
                exit(1);
              }
            }
            if (file_put_contents("/tmp/probe", "x") === false) {
              fwrite(STDERR, "could not write /tmp, which is the one writable mount\n");
              exit(1);
            }
            @unlink("/tmp/probe");
            echo "  /opt, /etc and /data refused; /tmp accepted\n";
          '

      - name: The baked view cache is the one being used, and is not writable
        run: |
          set -euo pipefail
          # The app image's own PHP, not the migrate image's: those are different store
          # paths, because migrate carries pdo_sqlite and the serving images do not. The
          # CLI sits beside php-fpm in the same buildEnv.
          php="$(dirname "$(docker inspect --format '{{index .Config.Cmd 0}}' victual-app:4.6.0)")/php"
          docker exec victual-app "$php" -r '
            $dir = getenv("VICTUAL_VIEWCACHE_PATH");
            if (is_writable($dir)) { fwrite(STDERR, "the baked cache is writable\n"); exit(1); }
            $compiled = 0;
            foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($dir)) as $f) {
              if ($f->isFile()) { $compiled++; }
            }
            echo "  compiled templates in the baked cache: $compiled\n";
            if ($compiled < 97) { fwrite(STDERR, "the cache looks unwarmed\n"); exit(1); }
          '

      - name: The extension list is what nix/php.nix says it is
        run: |
          set -euo pipefail
          # The app image's own PHP, not the migrate image's: those are different store
          # paths, because migrate carries pdo_sqlite and the serving images do not. The
          # CLI sits beside php-fpm in the same buildEnv.
          php="$(dirname "$(docker inspect --format '{{index .Config.Cmd 0}}' victual-app:4.6.0)")/php"
          docker exec victual-app "$php" -r '
            $loaded = array_map("strtolower", get_loaded_extensions());
            foreach (["pdo_pgsql", "gd", "intl", "curl"] as $required) {
              if (!in_array($required, $loaded)) { fwrite(STDERR, "missing: $required\n"); exit(1); }
            }
            // pcntl left with nix/runtime/entrypoint.php (issue #49); pdo_sqlite is the
            // migrate image only, since ADR-0008 keeps SQLite as an import format.
            // zip and xmlwriter went in plan 20 piece 2 (issue #133): each had been listed on a
            // caller that does not exist, and the walk below is unchanged without them.
            foreach (["pcntl", "pdo_sqlite", "zip", "xmlwriter"] as $forbidden) {
              if (in_array($forbidden, $loaded)) { fwrite(STDERR, "unexpectedly present: $forbidden\n"); exit(1); }
            }
            echo "  extensions are as declared\n";
          '

      # Every page, the read side of the API and one write cycle, over HTTP, against the images
      # rather than against whatever PHP setup-php provides. This is the half of "CI and
      # production build different things" that the boot test above does not reach: that test
      # proves the images start and serve /login, and this proves they serve the rest, on the
      # extension list nix/php.nix actually enables and as the role that cannot run DDL.
      #
      # Two known failures, both found by the first walk on 2026-09-18 and both unrelated to
      # this workflow: `GET /` and `/mealplan` answer 500 on master. They are named so that
      # the walk can be a gate today; each fix deletes its line here.
      - name: Walk every page and the API
        run: |
          python3 .devtools/nix/walk.py --base-url http://127.0.0.1:8080 \
            --known /=500 --known /mealplan=500

      - name: Container logs, if anything went wrong
        if: failure()
        run: |
          for c in victual-db victual-app victual-web; do
            echo "--- $c ---"
            docker logs "$c" 2>&1 | tail -40 || true
          done
