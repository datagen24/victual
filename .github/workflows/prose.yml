name: prose

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Vale
        run: python3 .devtools/vale/install.py --directory "$RUNNER_TEMP/vale"
      - name: Verify rules and baseline comparison
        env:
          VALE: ${{ runner.temp }}/vale/vale
        run: python3 -m unittest discover -s .devtools/vale -p 'test_*.py'
      - name: Reject new prose findings
        env:
          VALE: ${{ runner.temp }}/vale/vale
        run: python3 .devtools/vale/audit.py --check --output "$RUNNER_TEMP/prose-audit.json"
      - name: Upload complete report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prose-audit
          path: ${{ runner.temp }}/prose-audit.json
          if-no-files-found: warn
