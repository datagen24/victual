# Publish a tagged release's images (ADR-0030).
#
# A `v*` tag placed on master builds the six Nix images for x86_64 and aarch64, boots and
# walks each architecture's images through the `nix` workflow, pushes them to GHCR as one
# multi-architecture tag per image, pushes the Helm chart to GHCR as an OCI artifact
# (ADR-0038 decision 5), and creates the GitHub release with their digests.
#
# The tag is the maintainer's act, from the workstation, signed (docs/releases/README.md).
# This workflow places nothing and decides nothing: it refuses a tag that disagrees with
# version.json or with the chart's Chart.yaml, that has no release record, or that is not
# on master, and otherwise publishes exactly what the tag names.
#
# A pull request that changes this file runs the two builds and stops there, so the
# aarch64 half is proven before a tag depends on it. Nothing is pushed from a pull request.

name: release

permissions:
  contents: read

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: echo "version=$(jq -r .Version version.json)" >> "$GITHUB_OUTPUT"

      # The four refusals. Each is a mistake that is cheap to make at a terminal and
      # expensive to discover after the images are public.
      #
      # Chart.yaml is read with sed because Helm is installed only in `publish`. Its two
      # keys are top-level scalars in a file this repository writes, and
      # test_helm_chart.ChartVersionTest holds them to version.json on every pull request;
      # this repeats the check at the tag, where a disagreement would publish.
      - name: The tag is version.json's and Chart.yaml's, has a record, and is on master
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$VERSION" ]; then
            echo "tag $tag does not match version.json's Version ($VERSION); expected v$VERSION" >&2
            exit 1
          fi
          chart=deploy/helm/victual/Chart.yaml
          chart_version=$(sed -n 's/^version:[[:space:]]*//p' "$chart" | tr -d "\"'")
          chart_app_version=$(sed -n 's/^appVersion:[[:space:]]*//p' "$chart" | tr -d "\"'")
          if [ "$chart_version" != "$VERSION" ] || [ "$chart_app_version" != "$VERSION" ]; then
            echo "tag $tag does not match $chart: version $chart_version," \
              "appVersion $chart_app_version; expected $VERSION for both" >&2
            exit 1
          fi
          record="docs/releases/$VERSION.md"
          if [ ! -f "$record" ]; then
            echo "no release record at $record" >&2
            exit 1
          fi
          if ! grep -qF "($VERSION.md)" docs/releases/README.md; then
            echo "docs/releases/README.md does not list $VERSION" >&2
            exit 1
          fi
          git fetch -q origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "tag $tag points at $GITHUB_SHA, which is not on master" >&2
            exit 1
          fi
          echo "v$VERSION: chart agrees, record present, commit on master"

  images:
    needs: identity
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/nix.yml
    with:
      runner: ${{ matrix.runner }}
      artifact-name: images-${{ matrix.arch }}

  publish:
    needs: [identity, images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digests: ${{ steps.manifest.outputs.digests }}
      chart: ${{ steps.chart.outputs.chart }}
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: images-*
          path: images

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # One tag per architecture first. The loaded name is the flake's `victual-<c>:<version>`
      # for both architectures, so each is retagged and removed before the next is loaded.
      - name: Push each architecture
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            for tar in images/images-$arch/*.tar; do
              component=$(basename "$tar" .tar)
              local_ref="victual-$component:$VERSION"
              remote_ref="$REGISTRY/victual-$component:$VERSION-$arch"
              docker load --input "$tar"
              actual=$(docker image inspect --format '{{.Architecture}}' "$local_ref")
              if [ "$actual" != "$arch" ]; then
                echo "$tar is $actual, expected $arch" >&2
                exit 1
              fi
              docker tag "$local_ref" "$remote_ref"
              docker push "$remote_ref"
              docker rmi "$local_ref" "$remote_ref" >/dev/null
            done
          done

      - name: Join them into one tag per image
        id: manifest
        run: |
          set -euo pipefail
          : > digests.txt
          for component in app web migrate label-renderer label-worker mcp; do
            ref="$REGISTRY/victual-$component:$VERSION"
            docker buildx imagetools create --tag "$ref" "$ref-amd64" "$ref-arm64"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$ref@$digest" >> digests.txt
          done
          cat digests.txt
          {
            echo 'digests<<EOF'
            cat digests.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The chart (ADR-0038 decision 5). The tagged commit's tree, which `identity` has
      # already held to the tag.
      - uses: actions/checkout@v7
        with:
          path: source

      # The same Helm as the `lint` job in tests.yml, pinned by the same checksum, so the
      # chart is packaged by the Helm that rendered deploy/k3s/. Bump both together.
      - name: Install Helm
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          archive="helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://get.helm.sh/$archive"
          echo "$HELM_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" linux-amd64/helm
          # On PATH for the later steps; GITHUB_PATH does not apply to this one.
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/linux-amd64/helm" version

      # `helm push` names the artifact from the chart: oci://<prefix>/victual:<version>.
      # The tag is the chart's version and nothing else, so there is no `latest`
      # (ADR-0030 decision 7).
      - name: Package and push the chart
        id: chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package source/deploy/helm/victual --destination chart
          package="chart/victual-$VERSION.tgz"
          if [ ! -f "$package" ]; then
            echo "helm package did not write $package:" >&2
            ls chart >&2
            exit 1
          fi
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$package" "oci://$REGISTRY/charts" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest:[[:space:]]*//p' push.txt)
          case "$digest" in
            sha256:*) ;;
            *) echo "no digest in helm push's output" >&2; exit 1 ;;
          esac
          echo "chart=oci://$REGISTRY/charts/victual:$VERSION@$digest" >> "$GITHUB_OUTPUT"

  release:
    needs: [identity, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      DIGESTS: ${{ needs.publish.outputs.digests }}
      CHART: ${{ needs.publish.outputs.chart }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The record is linked rather than copied: its relative links resolve in the
      # repository and would not in a release body.
      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          {
            echo "The release record is [docs/releases/$VERSION.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/releases/$VERSION.md)."
            echo
            echo "Images, for linux/amd64 and linux/arm64. Pull by digest to get exactly these bytes:"
            echo
            echo '```'
            printf '%s\n' "$DIGESTS"
            echo '```'
            echo
            echo "The Helm chart. Helm checks the digest when it pulls this reference:"
            echo
            echo '```'
            echo "helm install victual $CHART"
            echo '```'
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --verify-tag --title "Victual $VERSION" --notes-file notes.md
          fi
