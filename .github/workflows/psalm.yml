name: Psalm Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '33 7 * * 4'

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  php-security:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    name: Psalm Static & Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP and Psalm
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype
          tools: composer:v2, psalm:6
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Run Psalm security analysis
        id: psalm
        continue-on-error: true
        run: >
          psalm
          --no-cache
          --taint-analysis
          --output-format=github
          --report=results.sarif

      - name: Upload security analysis
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: psalm-security

      - name: Enforce Psalm result
        if: steps.psalm.outcome == 'failure'
        run: exit 1
