name: Psalm Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '33 7 * * 4'

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  php-security:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run-tests == 'true')
    name: Psalm Static & Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP and Psalm
        uses: shivammathur/setup-php@v2
        env:
          update: true
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype
          tools: composer:v2, psalm:6
          coverage: none

      # setup-php installs the newest patch of a major.minor only with update: true, and
      # cannot pin one, so assert the PHP2Shell floor (#1043): ~8.4.27 || ^8.5.12.
      - name: Check the PHP floor
        run: |
          php -v
          php -r 'exit(version_compare(PHP_VERSION, PHP_MINOR_VERSION === 4 ? "8.4.27" : "8.5.12", ">=") ? 0 : 1);' \
            || { echo "::error::PHP $(php -r 'echo PHP_VERSION;') is below the PHP2Shell floor (#1043)"; exit 1; }

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Run Psalm security analysis
        id: psalm
        continue-on-error: true
        run: >
          psalm
          --no-cache
          --taint-analysis
          --output-format=github
          --report=results.sarif

      - name: Upload security analysis
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: psalm-security

      - name: Enforce Psalm result
        if: steps.psalm.outcome == 'failure'
        run: exit 1
