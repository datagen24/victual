      color: var(--color-ink);

      padding: 3rem 2rem;

      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;

      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1100px; display: block; }

      <title id="erd-consumption-title">Victual consumption recipes and events data model</title>
      <desc id="erd-consumption-desc">A consumption recipe is a private list of product quantities owned by one user. Its lines name products and units, its shares grant named users the right to consume, edit, undo or share it, and its events record each consumption, booked once under the key of user, source system and source event id. A mapping binds an external client's medication reference to a recipe or a product. A booked event line names the stock log entry it consumed. Every reference drawn here is a declared foreign key.</desc>
