      <title id="erd-labels-title">Victual label templates and rendering data model</title>
      <desc id="erd-labels-desc">A label template has immutable published versions and one working draft, and points at its default version. A render request combines a template version, a field capture and a media profile and yields an artifact; artifacts, requests and captures are linked by declared foreign keys, while captures name the label they were taken for by uid alone. Artifacts also copy the three ids they were rendered from, and requests may point at a draft template instead of a version; neither is drawn.</desc>
