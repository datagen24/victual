# Development and CI environment for the differential test suite.
#
#   docker compose run --rm dev .devtools/pgsql/run-tests.sh
#
# The `dev` service mounts the working tree over /app so edits are picked up without a
# rebuild, while keeping the image's `packages/` (composer output) — that directory is
# gitignored and does not exist on the host.

services:
  postgres:
    # Built rather than pulled plain, so the pgtap extension (ADR-0025 tier 2) is there
    # for `run-tests.sh pgtap` from a clean checkout - decision 6 installs it only where
    # PostgreSQL runs for tests, which for local/CI use is this container, not the dev
    # image (that one never runs a PostgreSQL server itself).
    build:
      context: .
      dockerfile: .devtools/pgtap/postgres.Dockerfile
    # victual/victual, in the open, on purpose: this database exists for the length of a
    # suite run, on a tmpfs, with no published ports, and every run creates it from
    # nothing. Sweep finding S25 records the credentials as an Info-level observation
    # about exactly this file, and the production images bake no credentials at all - they
    # read VICTUAL_DB_* from the deployment. Changing these would move the secret rather
    # than remove it, and would break every documented invocation of the suite.
    environment:
      POSTGRES_USER: victual
      POSTGRES_PASSWORD: victual
      POSTGRES_DB: victual
    # No persistent volume on purpose: every run of the suite should start from a
    # database it created itself. A stale volume is how a passing suite starts lying.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victual -d victual"]
      interval: 2s
      timeout: 3s
      retries: 30

  dev:
    build:
      context: .
      # Named although it is now the Dockerfile's only stage: the name is what this
      # service is asking for, and a file that grows a second stage should not silently
      # change what this builds. See the Dockerfile's header for where production went.
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      # Keep the image's vendor directory rather than shadowing it with the host's
      # (absent) one.
      - /app/packages
      # Scratch space for the databases the suite builds and throws away.
      - suite-scratch:/scratch
    environment:
      VICTUAL_ROOT: /app

      # These are the only variables to set. run-tests.sh derives every DIFFTEST_* and
      # TRIGTEST_* value from them and exports it, which is the whole point of having a
      # runner — setting the two namespaces here as well would look tidy and be dead, since
      # the runner overwrites them. PGHOST in particular has to be the service name, or the
      # runner falls back to 127.0.0.1 and dials a database that is not there.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: victual
      PGPASSWORD: victual

      # Where the throwaway databases go. Points at the volume below; without it the
      # runner uses /tmp inside the container and the volume is never touched.
      SUITE_SCRATCH: /scratch

      # Passed through from the host when set, absent otherwise, so
      #   SUITE_COVERAGE=1 docker compose run --rm dev .devtools/pgsql/run-tests.sh
      # measures the run. The image already has pcov. See .devtools/coverage/README.md.
      SUITE_COVERAGE:
      SUITE_COVERAGE_CLOVER:
    working_dir: /app

volumes:
  suite-scratch:
