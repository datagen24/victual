# The kind test harness: deploy/k3s's two workloads, unchanged, plus a throwaway
# PostgreSQL and the values that make them connect. `deploy/kind/up.sh` is the entry point
# (it loads the images and creates the roles script's ConfigMap first); `kubectl apply -k
# deploy/kind` is what it runs.
#
# **Every password below is local-only**, for the same reason as deploy/README.md's podman
# walkthrough: they are for a database that lives in an emptyDir and dies with its pod. A
# real deployment writes its own overlay with its own Secrets and never commits them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victual

resources:
  - namespace.yaml
  - ../k3s
  - postgres.yaml
  - roles-job.yaml

secretGenerator:
  - name: victual-postgres-superuser
    literals:
      - password=kind-superuser
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: ConfigMap
      name: victual-config
    patch: |-
      - op: replace
        path: /data/VICTUAL_DB_HOST
        value: victual-postgres
      - op: replace
        path: /data/VICTUAL_BASE_URL
        value: http://localhost:8080
  - target:
      kind: Secret
      name: victual-db-migrate
    patch: |-
      - op: replace
        path: /stringData/VICTUAL_DB_PASSWORD
        value: kind-migrate
  - target:
      kind: Secret
      name: victual-db-app
    patch: |-
      - op: replace
        path: /stringData/VICTUAL_DB_PASSWORD
        value: kind-app
