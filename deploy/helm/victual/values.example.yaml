# Victual deployment values: everything a deployment needs, in one file.
#
#   cp deploy/helm/victual/values.example.yaml values.yaml
#   $EDITOR values.yaml                                 # fill in every CHANGE-ME
#   helm template victual deploy/helm/victual -f values.yaml          # check it
#   helm upgrade --install victual deploy/helm/victual -f values.yaml \
#        --namespace victual --create-namespace --wait --timeout 10m
#
# Keep values.yaml out of version control: it names your hosts and, with
# `secrets.source: inline`, holds your passwords.
#
# The namespace and the cluster are Helm's flags (`--namespace`, `--kube-context`), not
# values. Any value left as CHANGE-ME stops the install with the field's path, from
# values.schema.json; so does a field this chart does not know.
#
# Before the first install, once (ADR-0038 decision 10: the chart holds no superuser
# credential, so this step is yours):
#
#   1. Create the database and the two roles on your PostgreSQL server, as a superuser:
#
#        export MIGRATE_PASSWORD APP_PASSWORD     # set without typing them inline
#        psql -v ON_ERROR_STOP=1 -v db=victual \
#             -f deploy/postgres/roles.sql "postgresql://postgres@<db-host>/victual"
#
#      roles.sql reads both passwords from psql's environment and refuses `-v` arguments,
#      which any user of the machine can read with `ps`. Its header shows how to set them.
#
#      Run it again after the first install has migrated the schema; roles.sql's header says
#      why. The two passwords are the ones `secrets` below supplies.
#   2. Put those passwords where `secrets` says they are (1Password, or below).

# --- Which version ---------------------------------------------------------------------
image:
  registry: ghcr.io/datagen24
  # Empty is the chart's own version, which is what a release tag publishes for amd64 and
  # arm64. Name a tag only to run images other than the ones this chart was released with.
  tag: ""

# --- How people reach it -----------------------------------------------------------------
# Empty derives it from the Ingress below: https://<host> with TLS, http://<host> without.
# Set it when something other than this chart's Ingress publishes Victual.
baseUrl: ""

ingress:
  enabled: true
  # The IngressClass your cluster's ingress controller answers to.
  className: traefik
  # The hostname Victual is served at. Its DNS must point at the ingress controller.
  host: CHANGE-ME.example.com
  tls:
    # true serves https://<host>. Then either name an existing TLS Secret in the namespace,
    # or leave secretName empty and let an annotation below (cert-manager, say) create it.
    enabled: false
    secretName: ""
  # Extra annotations for the Ingress, e.g. cert-manager.io/cluster-issuer: letsencrypt.
  annotations: {}

# --- The database: your PostgreSQL server ------------------------------------------------
database:
  host: CHANGE-ME-postgres.example.internal
  port: 5432
  name: victual
  # libpq sslmode: disable, allow, prefer, require, verify-ca or verify-full. Empty uses
  # libpq's default (prefer).
  sslmode: ""

# --- Home Assistant over MQTT (optional) ---------------------------------------------------
# docs/manual/operator/home-assistant-mqtt.md says what is published. Victual publishes after
# every write. With enabled: true, a post-install and post-upgrade hook Job also runs
# bin/victual-publish-state after each `helm install` and `helm upgrade`, which the manual
# asks for after every deployment.
mqtt:
  enabled: false
  # Required with enabled: true.
  host: ""
  # 8883 is usual with tls: true.
  port: 1883
  tls: false
  # Empty for an anonymous broker. The password comes from `secrets`.
  username: ""
  topicPrefix: victual
  discoveryPrefix: homeassistant
  # device (Home Assistant 2024.11+) or entity.
  discoveryMode: device
  deviceName: Victual

# --- Price and stock-value events to InfluxDB v2 (optional) --------------------------------
influxdb:
  enabled: false
  # Required with enabled: true, e.g. http://influxdb.example.internal:8086.
  url: ""
  org: victual
  bucket: victual
  # The token comes from `secrets`.

# --- The read-only MCP server for AI assistants (optional) ---------------------------------
mcp:
  # Two replicas, reachable only inside the cluster (service victual-mcp, port 3000).
  enabled: true

# --- The label renderer and worker (optional) ----------------------------------------------
# Two CronJobs that drain the label queue every minute, with API keys an administrator issues
# from Victual (docs/plans/25-label-infrastructure.md). Off until you have a printer.
labelWorkers:
  enabled: false

# --- Any other setting -------------------------------------------------------------------
# Every setting in docs/manual/configuration.md, by its name there (no VICTUAL_ prefix).
# The database, URL, MQTT and InfluxDB settings come from the sections above and are
# refused here, as are MODE, DB_DRIVER and FILE_STORAGE, which this chart fixes.
settings:
  CURRENCY: USD
  DEFAULT_LOCALE: en
  # ENTRY_PAGE: stock
  # CALENDAR_FIRST_DAY_OF_WEEK: "1"

# --- Passwords and tokens ------------------------------------------------------------------
secrets:
  # onepassword: read from 1Password through the cluster's Connect operator. Nothing secret
  #              is in this file.
  # inline:      written below, in this file, and applied as Kubernetes Secrets. Helm keeps
  #              each release's rendered manifests in a Secret in the namespace, so every
  #              past password stays there too.
  # existing:    the Secrets already exist under the names below, written by any other
  #              means; the chart renders none.
  source: onepassword

  names:
    migrate: victual-db-migrate
    app: victual-db-app
    bootstrapAdmin: victual-bootstrap-admin
    mqtt: victual-mqtt
    influxdb: victual-influxdb
    labelCredentials: victual-label-credentials

  onepassword:
    # A vault your Connect server can read.
    vault: CHANGE-ME-vault
    # One item per credential. The operator makes a Secret from each, one key per field, so
    # the field labels must be exactly these, and an item holds nothing else:
    #
    #   migrate item:        VICTUAL_DB_USER (victual_migrate), VICTUAL_DB_PASSWORD
    #   app item:            VICTUAL_DB_USER (victual_app), VICTUAL_DB_PASSWORD
    #   bootstrap item:      VICTUAL_BOOTSTRAP_ADMIN_PASSWORD (the first admin login)
    #   MQTT item:           VICTUAL_MQTT_PASSWORD; read only with mqtt.enabled and a username
    #   InfluxDB item:       VICTUAL_INFLUXDB_TOKEN; read only with influxdb.enabled
    #   label credentials:   renderer-key, worker-key; read only with labelWorkers.enabled
    #
    # The database items hold the database credential alone so that rotating it can rewrite
    # the item whole without losing another field. Items from before that split kept the
    # other values in the database items; deploy/README.md, "One Secret per credential",
    # moves them without changing one. deploy/talos/seed-1password.sh shows one way to
    # create the items.
    items:
      migrate: victual-db-migrate
      app: victual-db-app
      bootstrapAdmin: victual-bootstrap-admin
      mqtt: victual-mqtt
      influxdb: victual-influxdb
      labelCredentials: victual-label-credentials

  # With source: inline only. The first three are then required; the others only when their
  # feature is enabled.
  inline:
    migratePassword: ""
    appPassword: ""
    # The first admin login's password. Used once, when the first install creates the schema.
    bootstrapAdminPassword: ""
    mqttPassword: ""
    influxdbToken: ""
    labelRendererKey: ""
    labelWorkerKey: ""
