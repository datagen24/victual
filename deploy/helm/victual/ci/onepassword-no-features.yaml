# Every optional workload and feature off, with OnePasswordItem resources for the Secrets.
# MQTT is on with an anonymous broker, so it needs no Secret.
baseUrl: https://victual.example.com
database: {host: postgres.example.internal}
mqtt: {enabled: true, host: mqtt.example.internal, username: ""}
influxdb: {enabled: false}
mcp: {enabled: false}
labelWorkers: {enabled: false}
secrets:
  source: onepassword
  onepassword: {vault: household}
