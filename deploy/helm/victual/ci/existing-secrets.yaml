# Secrets written by something else under names of the operator's choosing: the chart
# renders none and the pods require the ones their features need.
baseUrl: https://victual.example.com
database: {host: postgres.example.internal}
mqtt: {enabled: true, host: mqtt.example.internal, username: victual}
influxdb: {enabled: true, url: "http://influxdb.example.internal:8086"}
labelWorkers: {enabled: true}
secrets:
  source: existing
  names:
    migrate: vault-victual-migrate
    app: vault-victual-app
    bootstrapAdmin: vault-victual-bootstrap
    mqtt: vault-victual-mqtt
    influxdb: vault-victual-influxdb
    labelCredentials: vault-victual-labels
