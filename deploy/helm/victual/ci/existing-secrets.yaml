# Secrets written by something else under names of the operator's choosing: the chart
# renders none and the pods require the ones their features need.
baseUrl: https://victual.example.com
database: {host: postgres.example.internal}
mqtt: {enabled: true, host: mqtt.example.internal, username: victual}
influxdb: {enabled: true, url: "http://influxdb.example.internal:8086"}
labelWorkers: {enabled: true}
secrets:
  source: existing
  names:
    migrate: vault-victual-migrate
    app: vault-victual-app
    bootstrapAdmin: vault-victual-bootstrap
    mqtt: vault-victual-mqtt
    influxdb: vault-victual-influxdb
    labelCredentials: vault-victual-labels
# Keycloak's realm in check mode against an operator's Keycloak, reached in-cluster, with the
# Entra ID template and the MCP audience set by hand (no sidecar Ingress here).
keycloakSetup:
  enabled: true
  checkOnly: true
  url: https://sso.example.com
  adminUrl: http://keycloak.identity.svc:8080
  adminSecret: vault-keycloak-admin
  realmSecret: vault-keycloak-realm
  redirectUri: https://victual.example.com/oauth/callback
  mcpAudience: https://mcp.example.com/mcp
  kubernetesIssuer: https://kubernetes.default.svc.cluster.local
  entra: {tenantId: 00000000-0000-0000-0000-000000000000, clientId: victual-entra-app}
