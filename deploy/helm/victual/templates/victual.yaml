# Victual on Kubernetes, written for k3s: a Deployment, a Service, and the ConfigMap and
# Secrets the pod reads.
#
#   kubectl apply -f deploy/k3s/victual.yaml
#   kubectl delete -f deploy/k3s/victual.yaml
#
# This is deploy/podman/victual.yaml as a workload rather than a bare Pod, and the two are
# meant to stay the same pod: same containers, same probes, same security context, same
# credentials per container. .devtools/ci/test_deploy_pod_parity.py fails when they drift, so
# a probe fixed in one is not left wrong in the other. What differs is only what a cluster
# adds (a controller to restart it, a Service to reach it) and what a laptop needs (a
# hostPort, `imagePullPolicy: Never`).
#
# **Status: applied to a cluster, 2026-09-19** — kind (Kubernetes v1.37, one node, podman
# provider) through deploy/kind, with the MCP sidecar beside it (issue #86). The
# migrate initContainer ran all migrations as `victual_migrate`, php-fpm served as
# `victual_app`, and all three probes passed. Two things the cluster showed that podman
# could not:
#   - `lifecycle.stopSignal` is **dropped by the API server** on v1.37 without the
#     ContainerStopSignals gate. The stored Deployment has no `lifecycle` at all, so
#     both containers get SIGTERM. See deploy/README.md, "Signals".
#   - The initContainer failing while the roles do not exist yet is expected, and
#     converges: it exited 1 once, was restarted by the kubelet, and succeeded.
# Applied to a real cluster on 2026-10-06: the maintainer's Talos cluster (v1.37, arm64),
# through deploy/talos, from the published images; the same three findings held. An apply
# that reaches a printer is plan 25's verification 12 and is still open.
#
# PostgreSQL is not in here, nor ingress, nor a storage class: the fork declares what its
# workloads need and the operator decides where they run (ADR-0010's boundary, and
# deploy/README.md). Before applying:
#
#   1. Create the two database roles with deploy/postgres/roles.sql.
#   2. Put their passwords in the two database Secrets below, and the database's address
#      in the ConfigMap. The values in this file are placeholders and will not connect.
#      The first administrator's password has a Secret of its own, blank here; the MQTT
#      password and the InfluxDB token have Secrets of their own too, which this file does
#      not create (see "One Secret per credential" in deploy/README.md).
#   3. The images below are the ones a release tag publishes to GHCR for amd64 and arm64
#      (ADR-0030, .github/workflows/release.yml); a node pulls them by the version tag. To
#      run a local build instead, point `image:` at what `nix run .#load` produces, or set
#      the chart's image.registry to `localhost` as deploy/kind/values.yaml does.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victual-config
  labels:
    app.kubernetes.io/name: victual
data:
  {{- include "victual.config" . | nindent 2 }}
{{- include "victual.credentialSecrets" . }}
---
apiVersion: v1
kind: Service
metadata:
  # `victual`, because label-workers.yaml beside this file already points its workers at
  # http://victual:8080. The podman and Compose copies reach a published host port and an
  # external network instead, which is one of the differences
  # .devtools/ci/test_deploy_label_parity.py allows.
  name: victual
  labels:
    app.kubernetes.io/name: victual
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victual
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victual
  labels:
    app.kubernetes.io/name: victual
spec:
  # One replica until something measures whether a second helps a household-sized instance
  # (plan 20 piece 4). Plan 10's migration lock means correctness is no longer what stops
  # anyone raising it: two pods starting together serialise on the advisory lock.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victual
  # The default rolling update, and worth reading once. The new pod's migrate initContainer
  # runs while the old pod is still serving, so for as long as it takes the old code sees a
  # schema newer than it knows and SchemaVersionMiddleware answers it 503; the old pod goes
  # away when the new one is ready. That window is short and it fails closed, which is why
  # `Recreate` (a guaranteed outage) is not chosen to avoid it.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victual
      annotations:
        # envFrom is read once, at container start, so without these a changed ConfigMap or
        # Secret leaves the running pod on the old values until something else restarts it
        # (issue #852). The hash is of what this chart renders and nothing more; Secrets
        # the chart does not render (secrets.source existing / onepassword) are not hashed,
        # see the note above secrets.source in values.yaml.
        checksum/config: {{ include "victual.config" . | sha256sum }}
        {{- if eq .Values.secrets.source "inline" }}
        checksum/secrets: {{ include "victual.credentialSecrets" . | sha256sum }}
        {{- end }}
    spec:
      # Nothing here talks to the Kubernetes API, so the pod gets no ServiceAccount token
      # (issue #861).
      automountServiceAccountToken: false
      # `lifecycle.stopSignal` below is only accepted for a pod that says what OS it is for.
      os:
        name: linux

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Honoured by a real cluster, unlike `podman kube play` (issue #49). Nothing writable
        # is mounted except the two /tmp volumes, so this is belt and braces today.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: tmp-app
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp-web
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

      initContainers:
        # See deploy/podman/victual.yaml for why migration is a startup step and why this
        # is the only container holding a role that can run DDL.
        - name: migrate
          image: {{ include "victual.image" (dict "root" . "name" "victual-migrate") }}
          envFrom:
            - configMapRef:
                name: victual-config
            - secretRef:
                name: {{ .Values.secrets.names.migrate }}
            # Required, so a pod cannot start before the Secret exists and seed a generated
            # password in place of the operator's.
            - secretRef:
                name: {{ .Values.secrets.names.bootstrapAdmin }}
          volumeMounts:
            - name: tmp-app
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources.migrate }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      containers:
        - name: app
          image: {{ include "victual.image" (dict "root" . "name" "victual-app") }}
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: victual-config
            - secretRef:
                name: {{ .Values.secrets.names.app }}
            # VICTUAL_MQTT_PASSWORD and VICTUAL_INFLUXDB_TOKEN, each in a Secret of its own and
            # optional: a deployment without MQTT or InfluxDB creates neither.
            - secretRef:
                name: {{ .Values.secrets.names.mqtt }}
                optional: {{ not (include "victual.wantsMqttSecret" .) }}
            - secretRef:
                name: {{ .Values.secrets.names.influxdb }}
                optional: {{ not (include "victual.wantsInfluxdbSecret" .) }}
          volumeMounts:
            - name: tmp-app
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # An exec probe and it must stay one: the kubelet resolves a TCP probe to the pod
          # IP while php-fpm binds loopback only. See deploy/podman/victual.yaml.
          startupProbe:
            exec:
              command: ["/opt/victual/healthcheck"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/opt/victual/healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.resources.app }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # php-fpm's graceful stop. This field is alpha (feature gate ContainerStopSignals,
          # Kubernetes 1.33) and, on a cluster without the gate, is dropped by the API
          # server: the container then gets SIGTERM, which php-fpm and nginx treat as "stop
          # now". Plan 20 verification 9 measured what that costs; see deploy/README.md.
          lifecycle:
            stopSignal: SIGQUIT

        - name: web
          image: {{ include "victual.image" (dict "root" . "name" "victual-web") }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp-web
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # exec rather than httpGet, for the reason in deploy/podman/victual.yaml: the
          # image has no shell and no curl, and an exec probe means the same thing to
          # podman and to the kubelet, which is what lets the two manifests stay one pod.
          startupProbe:
            exec:
              command: ["/opt/victual/webcheck", "/robots.txt"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/opt/victual/webcheck", "/robots.txt"]
            periodSeconds: 10
          # Through nginx, FastCGI, PHP and the database, and through the schema gate.
          readinessProbe:
            exec:
              command: ["/opt/victual/webcheck", "/login"]
            periodSeconds: 5
            failureThreshold: 6
          {{- with .Values.resources.web }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            stopSignal: SIGQUIT
