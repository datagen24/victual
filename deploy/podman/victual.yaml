# Victual, as one pod: migrate, then php-fpm and nginx side by side.
#
# This is a Kubernetes Pod manifest and it is deliberately not a compose file. The
# deployment target is k3s, the two serving containers talk over loopback, and a pod is
# the only local shape that reproduces that — `podman kube play` gives the containers a
# shared network namespace exactly as Kubernetes does, so 127.0.0.1:9000 means the same
# thing on a laptop as it does in the cluster. A compose file would need
# `network_mode: service:` to fake it and would then be a second thing to keep true.
#
#   podman kube play deploy/podman/victual.yaml
#   podman kube down deploy/podman/victual.yaml
#
# PostgreSQL is not in here. Per ADR-0010's boundary — the fork declares what its
# workloads need, the operator decides where they run — the database is the operator's,
# and deploy/README.md says how to stand a throwaway one up for the bootstrap.
#
# Status: applied and serving, 2026-09-04. The first application is what found issue #49
# — two ways this manifest meant something different under podman than it does under
# Kubernetes, both fixed here and both commented where they bit. See
# docs/plans/20-container-infrastructure.md, "Verification".
apiVersion: v1
kind: Pod
metadata:
  name: victual
  labels:
    app.kubernetes.io/name: victual
spec:
  restartPolicy: Always

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    # Without this the emptyDir volumes below are root:root 0755 and uid 65532 cannot
    # write to them. It is the single most common reason a correctly built non-root
    # image fails to start.
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  volumes:
    # There is no `data` volume. There was one, for two things that have both gone: the
    # view cache, baked into the image and mounted read-only since plan 10, and a
    # config.php that PrerequisiteChecker used to insist on, which the application no
    # longer requires at all (issue #49). Uploads are the third thing that would have
    # lived here and they go to the database instead — VICTUAL_FILE_STORAGE=database in
    # the ConfigMap, which plan 01 landed and which this deployment requires rather than
    # merely permits.
    #
    # What that buys is not tidiness. `fsGroup` below is not honoured by
    # `podman kube play`, so a writable emptyDir arrives root-owned and a uid-65532
    # container cannot write to it; keeping one meant the pod started under Kubernetes
    # and not on a laptop. VICTUAL_DATAPATH still points at /data, which exists in the
    # image as an empty read-only directory, so a deployment that wants to supply a real
    # config.php or a settingoverrides directory can mount one over it.
    #
    # /tmp is per-container: PHP's temporary files and nginx's buffer paths have no
    # business sharing a directory.
    - name: tmp-app
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: tmp-web
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi

  initContainers:
    # Since plan 10, nothing migrates inside a request and SchemaVersionMiddleware answers
    # 503 until the schema matches the code. Migrating here is what turns that from a
    # failure mode into a startup step: bin/victual-migrate is a no-op against an
    # up-to-date database, takes a pg_advisory_lock so concurrent runs are safe, and exits
    # non-zero on failure — so a bad migration keeps the pod from starting rather than
    # letting it start and answer 503 to everything.
    #
    # It is also the only container here that holds a database role able to run DDL.
    # `victual-db-migrate` carries VICTUAL_DB_USER and VICTUAL_DB_PASSWORD for
    # victual_migrate, the role that owns the schema; the `app` container below gets
    # `victual-db-app` instead, for a role that can read and write rows and nothing else
    # (ADR-0010 property 3, plan 20 verification 8). The two roles are created by
    # deploy/postgres/roles.sql. VICTUAL_DB_USER is deliberately absent from the ConfigMap:
    # two envFrom sources that both define a key resolve to the later one, and a user name
    # that could be supplied by either would make "which role is this container" depend on
    # list order.
    - name: migrate
      image: localhost/victual-migrate:0.2.0-MVP
      imagePullPolicy: Never
      envFrom:
        - configMapRef:
            name: victual-config
        - secretRef:
            name: victual-db-migrate
      volumeMounts:
        - name: tmp-app
          mountPath: /tmp
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

  containers:
    - name: app
      image: localhost/victual-app:0.2.0-MVP
      imagePullPolicy: Never
      ports:
        - name: fastcgi
          containerPort: 9000
      # The restricted role: rows, not structure. See the migrate initContainer above for
      # why this is a different Secret and not a different key in the same one.
      envFrom:
        - configMapRef:
            name: victual-config
        - secretRef:
            name: victual-db-app
      volumeMounts:
        - name: tmp-app
          mountPath: /tmp
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      # An exec probe, not tcpSocket, and the reason is not stylistic. The kubelet
      # resolves a TCP probe's target to the *pod IP*, while the pool binds 127.0.0.1
      # only (nix/runtime/fpm-conf.nix) so that nothing outside this pod's containers
      # can reach it. A tcpSocket probe would therefore fail against a perfectly
      # healthy php-fpm and restart it on every failure threshold — and setting the
      # probe's `host` to 127.0.0.1 would not fix it, because that names the *node's*
      # loopback. Only a probe running inside the container is in the right network
      # namespace to ask the question.
      #
      # /opt/victual/healthcheck is placed by nix/healthcheck.nix, with the interpreter
      # in its shebang so no shell is involved.
      startupProbe:
        exec:
          command: ["/opt/victual/healthcheck"]
        periodSeconds: 2
        failureThreshold: 30
      livenessProbe:
        exec:
          command: ["/opt/victual/healthcheck"]
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      # The image sets StopSignal=SIGQUIT (php-fpm's graceful stop). Kubernetes ignores
      # the image's StopSignal, so it is said again here. Older clusters without the
      # lifecycle.stopSignal field get SIGTERM, which php-fpm treats as "stop now" —
      # acceptable for a stateless request handler, but not the same thing.
      lifecycle:
        stopSignal: SIGQUIT

    - name: web
      image: localhost/victual-web:0.2.0-MVP
      imagePullPolicy: Never
      ports:
        - name: http
          containerPort: 8080
          hostPort: 8080
      volumeMounts:
        - name: tmp-web
          mountPath: /tmp
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      # An exec probe rather than httpGet, and — unlike the app container's, which is
      # about loopback binding — the reason is the runtime rather than the network.
      # `podman kube play` does not perform httpGet itself the way the kubelet does: it
      # rewrites the field into a container healthcheck, `CMD-SHELL curl -f <url> ||
      # exit 1`, and runs it inside the container. This image has no shell and no curl,
      # so the probe failed thirty times and podman killed a container that was serving
      # every request correctly. See issue #49 and nix/runtime/webcheck.c.
      #
      # /opt/victual/webcheck is a statically linked binary placed by nix/webcheck.nix.
      # It GETs the path it is given over loopback and exits 0 on 2xx or 3xx. An exec
      # probe means the same thing to podman and to the kubelet, which is what keeps
      # this one manifest.
      #
      # robots.txt is a static file the web tier serves without involving PHP, so this
      # proves nginx is up and its document root is mounted — and nothing more.
      startupProbe:
        exec:
          command: ["/opt/victual/webcheck", "/robots.txt"]
        periodSeconds: 2
        failureThreshold: 30
      livenessProbe:
        exec:
          command: ["/opt/victual/webcheck", "/robots.txt"]
        periodSeconds: 10
      # Readiness goes through the whole stack: nginx, FastCGI, PHP, the database. It
      # covers two things the app container's probe cannot see — a pool accepting
      # connections whose workers are all wedged, and the schema gate, since
      # SchemaVersionMiddleware answers 503 until the migration has finished. /login
      # rather than /api/system/info because that one needs an API key, and rather than a
      # static file because a static file proves none of it.
      readinessProbe:
        exec:
          command: ["/opt/victual/webcheck", "/login"]
        periodSeconds: 5
        failureThreshold: 6
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      lifecycle:
        stopSignal: SIGQUIT
