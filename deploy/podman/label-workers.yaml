# The two label workloads for `podman kube play`: the renderer that produces artifacts and
# the worker that prints them.
#
#   podman kube play --replace deploy/podman/label-workers.yaml
#   podman kube down deploy/podman/label-workers.yaml
#
# **These are `Job`s, and the kind is the whole reason this file is separate from
# [../k3s/label-workers.yaml](../k3s/label-workers.yaml).** Podman plays "Pods,
# Deployments, DaemonSets, Jobs, and PersistentVolumeClaims" (`podman kube play --help`,
# podman 6.0.2) — CronJob is not among them, and an unsupported kind inside a
# multi-document file is **skipped rather than refused**. Measured 2026-09-20 on podman
# 6.0.2, macOS, against the CronJob version of this file: the Secret was created, both
# CronJobs were dropped, and the command **exited 0** — a success code, no renderer, no
# worker, no printing. Reproduce it by putting a CronJob in a file and running
# `podman kube play file.yaml; echo $?; podman pod ls`. That is why a Kubernetes manifest
# cannot simply be pointed at podman, and why the three targets get three files.
#
# **A Job runs once, so something has to run it again.** `--replace` deletes and recreates
# the pods each time, which is what makes re-running this file work at all — without it the
# second invocation collides with the completed Job of the same name. Put it on a systemd
# timer, one unit per workload or one for both:
#
#   # ~/.config/systemd/user/victual-labels.service
#   [Unit]
#   Description=Drain the Victual label queues
#   [Service]
#   Type=oneshot
#   ExecStart=/usr/bin/podman kube play --replace %h/victual/deploy/podman/label-workers.yaml
#
#   # ~/.config/systemd/user/victual-labels.timer
#   [Unit]
#   Description=Drain the Victual label queues every minute
#   [Timer]
#   OnBootSec=1min
#   OnUnitActiveSec=1min
#   [Install]
#   WantedBy=timers.target
#
#   systemctl --user enable --now victual-labels.timer
#
# `Type=oneshot` is load-bearing, not decoration: systemd will not start a second run of a
# oneshot unit while one is still going, which is what `concurrencyPolicy: Forbid` buys on
# the cluster. A bare cron entry has no such interlock, and two workers on one printer's
# queue is the ownership ambiguity [ADR-0019](../../docs/adr/0019-label-printers-are-master-data.md)
# decision item 3 exists to remove. If you use cron, wrap it in `flock`.
#
# `podman kube play -w` is the other half worth knowing: it cleans up the objects when the
# pods exit, which suits a foreground run and not a timer.
#
# **Two differences from the Kubernetes file, and both are podman's.** The API base is
# `host.containers.internal` because deploy/podman/victual.yaml publishes 8080 to the host
# rather than sitting behind a Service; and `imagePullPolicy: Never` because these images
# are loaded locally by `nix run .#load` and there is no registry to reach.
# `.devtools/ci/test_deploy_label_parity.py` allows exactly those two and compares
# everything else against the other targets.
#
# Neither holds a database credential. Both authenticate to Victual's API with a typed key,
# which is ADR-0019 decision item 2 and is why a remote worker does not need the database
# reachable from wherever it sits.
#
# **Status: not applied.** The images build and the manifests pass the gate; nothing has
# been deployed and no physical label has been printed through this path. See
# docs/plans/25-label-infrastructure.md's verification 12.
---
apiVersion: v1
kind: Secret
metadata:
  name: victual-label-credentials
type: Opaque
stringData:
  # Issued by an administrator through POST /api/labels/workers/{id}/credentials and
  # POST /api/labels/workers/{id}/renderer-credentials, and typed: a renderer key is refused
  # on every worker route, which is what makes "a renderer may not claim a print attempt" a
  # property of the credential rather than a rule the renderer is trusted to follow.
  #
  # A declared worker's credential is injected here and never rotates - that is the platform's
  # own mechanism, the operator rotates it, and a host that can read this environment is
  # already a cluster compromise. The paired mode with its two clocks is for the USB case and
  # is not what this manifest deploys.
  renderer-key: "replace-me-with-a-label-renderer-key"
  worker-key: "replace-me-with-a-label-worker-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victual-label-config
data:
  # host.containers.internal, not a Service name: deploy/podman/victual.yaml publishes
  # 8080 to the host, and a second `podman kube play` is a separate pod with no cluster DNS
  # to resolve `victual` against.
  VICTUAL_API_BASE: "http://host.containers.internal:8080"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: victual-label-renderer
  labels:
    app.kubernetes.io/name: victual-label-renderer
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: credentials
          secret:
            secretName: victual-label-credentials
      containers:
        - name: renderer
          image: localhost/victual-label-renderer:0.1.1-MVP
          imagePullPolicy: Never
          args:
            - "--api"
            - "$(VICTUAL_API_BASE)"
            - "--key-file"
            - "/run/secrets/renderer-key"
            # Drains the queue rather than rendering one label per run. One invocation
            # still does one job at a time; what this changes is that a backlog clears in
            # one run instead of over the next hour.
            - "--drain"
          env:
            - name: VICTUAL_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: victual-label-config
                  key: VICTUAL_API_BASE
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
          resources:
            limits:
              memory: 128Mi
              cpu: "1"
            requests:
              memory: 32Mi
              cpu: "50m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: victual-label-worker
  labels:
    app.kubernetes.io/name: victual-label-worker
spec:
  # No probe and no replica count, because this is the same run-to-completion workload the
  # Kubernetes file deploys as a CronJob: the claim loop breaks on an empty queue and the
  # process exits 0, and it breaks only there, never mid-attempt, so it exits exactly when
  # it holds no lease. Deployed as a resident workload it produced the platform's restart
  # backoff as an effective poll interval — 10 s ramping to a five-minute cap, with a
  # `POST /api/labels/register` on every restart. It is also the shape that cannot be
  # stopped between claiming and reporting, which is ADR-0019 decision item 6's *uncertain*
  # attempt.
  #
  # One worker at a time is the timer's job here rather than the manifest's. `Type=oneshot`
  # in the header gives what `concurrencyPolicy: Forbid` gives on a cluster; a `Job` object
  # has no such field, and `parallelism: 1` only bounds this one invocation.
  backoffLimit: 2
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: credentials
          secret:
            secretName: victual-label-credentials
      containers:
        - name: worker
          image: localhost/victual-label-worker:0.1.1-MVP
          imagePullPolicy: Never
          args:
            - "--api"
            - "$(VICTUAL_API_BASE)"
            - "--key-file"
            - "/run/secrets/worker-key"
          env:
            - name: VICTUAL_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: victual-label-config
                  key: VICTUAL_API_BASE
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
          resources:
            limits:
              memory: 128Mi
              cpu: "1"
            requests:
              memory: 32Mi
              cpu: "50m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
