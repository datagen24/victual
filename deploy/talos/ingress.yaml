# Victual through the cluster's Traefik. The host is a nip.io name for Traefik's MetalLB
# address, so it resolves without any DNS change; replace it (and VICTUAL_BASE_URL in
# kustomization.yaml, which must match) when the cluster gets a real name and a certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victual
  labels:
    app.kubernetes.io/name: victual
spec:
  ingressClassName: traefik
  rules:
    - host: victual.10.130.34.240.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: victual
                port:
                  name: http
