# The four Secrets this overlay's pods read, from 1Password. The cluster's Connect operator
# watches OnePasswordItems in every namespace and writes a Secret of the same name, one key
# per item field, so the pods, the roles Job and PostgreSQL name these Secrets exactly as
# they named the generated ones before. deploy/talos/seed-1password.sh creates the items.
#
# The items live in the DevSecOps vault, the one vault the cluster's Connect server can
# read. Rotating a database password means ALTER ROLE first and the item second: the
# operator copies values, and does not know a password is also a database's state. That is
# also why no Deployment here sets operator.1password.io/auto-restart.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: victual-postgres-superuser
spec:
  itemPath: vaults/DevSecOps/items/victual-postgres-superuser
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: victual-db-migrate
spec:
  itemPath: vaults/DevSecOps/items/victual-db-migrate
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: victual-db-app
spec:
  itemPath: vaults/DevSecOps/items/victual-db-app
---
# The first administrator's password, read by the migrate initContainer only. An item of its
# own, so the database items hold their credential and nothing else (plan 36, "Item layout").
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: victual-bootstrap-admin
spec:
  itemPath: vaults/DevSecOps/items/victual-bootstrap-admin
