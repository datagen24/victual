#
# The read-only MCP sidecar (issue #86, docs/mcp-interface-spec.md): its own Deployment
# and Service beside Victual's, not a container in Victual's pod.
#
#   kubectl apply -f deploy/k3s/victual.yaml -f deploy/k3s/victual-mcp.yaml
#
# "Sidecar" is the spec's word for the shape — one small service next to Victual speaking
# MCP on one side and Victual's REST API on the other — not a pod layout. A separate
# Deployment is what §2 and §9 ask for: it holds no state, no database credential and no
# Victual API key (§8), so it can scale, restart and roll independently of the pod that
# does, and two replicas behind the Service must be indistinguishable from one (§11.5 is
# the soak that checks that, and why this starts at two).
#
# Exposure is cluster-, LAN- or tailnet-only (§9, plan 02 Q4). mcp.ingress, off by default,
# publishes the sidecar on its own hostname for clients on the household network (ADR-0052
# decisions 6 and 7); the hostname, certificate and middlewares are the operator's values
# (ADR-0010). Publishing /mcp beyond that network is a later stage that needs OAuth (§4.1).
#
# Clients authenticate with `Authorization: Bearer <Victual API key>`; the sidecar forwards
# the key to Victual on every call and stores nothing (§2, §4).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victual-mcp-config
  labels:
    app.kubernetes.io/name: victual-mcp
data:
  # Victual's own Service, from deploy/k3s/victual.yaml — in-cluster HTTP by design (§8:
  # TLS is the ingress's job; the sidecar never disables verification, it just never
  # leaves the cluster network).
  VICTUAL_BASE_URL: "http://victual:8080"
  # mcp.enabledTools: `all-read` is the read tools, `stock-write` the stock and list writes,
  # `catalog-write` the product, location, unit, group and barcode writes.
  # A comma-separated list names tools one by one; an unknown name stops the container at
  # startup rather than being ignored.
  MCP_ENABLED_TOOLS: "all-read"
  MCP_REQUEST_TIMEOUT_MS: "10000"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: victual-mcp
  labels:
    app.kubernetes.io/name: victual-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victual-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victual-mcp
  labels:
    app.kubernetes.io/name: victual-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: victual-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victual-mcp
      annotations:
        # envFrom is read once, at container start: a changed ConfigMap rolls the pods (issue #852).
        checksum/config: 25531065b28a4b287259d272bbaa1d627238d079c2c015532a9df80cb19f16c9
    spec:
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      containers:
        - name: mcp
          image: ghcr.io/datagen24/victual-mcp:0.5.3
