# The workloads this repository ships, as one kustomize base: `kubectl apply -k deploy/k3s`
# applies both, and an operator's overlay (deploy/kind is one) puts `../k3s` — or this
# repository's URL at a pinned ref — in its `resources` and patches the ConfigMap, the two
# Secrets and the image references for its own cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - victual.yaml
  - victual-mcp.yaml
  # The label renderer and worker. Included here so `kubectl apply -k deploy/k3s` deploys a
  # printer rather than leaving it to a second command nobody remembers; they were in
  # deploy/podman/ until 2026-09-20, where `podman kube play` silently skipped them. An
  # overlay that has no printer removes this entry rather than the file.
  - label-workers.yaml
