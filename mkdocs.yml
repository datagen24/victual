          - Barcodes and scanning: manual/operator/barcodes-scanning.md
          - Label printing: manual/operator/label-printing.md
          - Home Assistant and MQTT: manual/operator/home-assistant-mqtt.md
          - Roles and permissions: manual/operator/roles-permissions.md
