# Victual documentation site.
#
# docs_dir is a staging tree assembled by .devtools/docs/stage.py, not a directory in
# this repository: the developer section draws from docs/, .github/, and READMEs that
# sit beside the code they describe. Run the staging script before mkdocs.
#
# Design: docs/plans/landed/26-documentation-site.md
# What is published and why: docs/adr/0020-documentation-publication-boundary.md
site_name: Victual
site_description: A self-hosted groceries and household management application, forked from grocy.
site_url: https://victual.readthedocs.io/
repo_url: https://github.com/datagen24/victual
repo_name: datagen24/victual
edit_uri: ""
copyright: MIT, in two layers — see the licensing section of Contributing.

docs_dir: .docs-build

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon-32.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# A page that is not in the nav, or a link that does not resolve, fails the build under
# --strict. That is deliberate: an unindexed document should be a build failure rather
# than a file nobody finds.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Manual:
      - Overview: manual/index.md
      - Getting started: manual/getting-started.md
      - Configuration: manual/configuration.md
      - Using Victual:
          - Stock: manual/using-victual/stock.md
          - Shopping lists: manual/using-victual/shopping-lists.md
          - Recipes and meal plan: manual/using-victual/recipes-and-meal-plan.md
          - Chores: manual/using-victual/chores.md
          - Batteries: manual/using-victual/batteries.md
          - Tasks: manual/using-victual/tasks.md
          - Equipment: manual/using-victual/equipment.md
          - Calendar: manual/using-victual/calendar.md
          - Administration: manual/using-victual/administration.md
          - Tips: manual/using-victual/tips.md
      - Operator reference:
